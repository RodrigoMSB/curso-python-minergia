<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 04 · Qué va junto y qué viene después</title>
<style>
:root{--ink:#202124;--muted:#5f6368;--grid:#dadce0;--surf:#fff;--head:#f1f3f4;--celda:#f8f9fa;--navy:#0b3d62;
--azul:#1a73e8;--azul2:#e8f0fe;--ambar:#d99a00;--ambar2:#fef3d6;--verde:#188038;--verde2:#e6f4ea;--rojo:#c5221f;--rojo2:#fce8e6;--morado:#7b4fc9;--gris:#80868b;}
*{box-sizing:border-box}
html,body{margin:0;background:#f4f5f7;color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:700}
header .sub{font-size:13px;opacity:.8}
nav.caps{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav.caps button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
nav.caps button.on{background:#fff;color:var(--navy);font-weight:700}
main{display:grid;grid-template-columns:390px 1fr;gap:18px;padding:18px 24px;max-width:1540px;margin:0 auto;align-items:start}
@media (max-width:980px){main{grid-template-columns:1fr;padding:12px 16px}}
.panel{background:var(--surf);border:1px solid var(--grid);border-radius:14px;padding:20px 22px}
.story{display:flex;flex-direction:column;position:sticky;top:12px}
.capnum{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.story h2{font-size:23px;margin:4px 0 14px;line-height:1.2}
.story .texto{font-size:17.5px}
.story .texto p{margin:0 0 12px}
.story .texto b{color:var(--navy)}
.dato{display:inline;background:var(--ambar2);color:#5c4700;border-radius:6px;padding:0 6px;font-weight:700}
.remate{background:var(--ambar2);border-left:6px solid var(--ambar);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0 0;color:#5c4700;font-weight:600}
.navsteps{display:flex;align-items:center;gap:10px;margin-top:14px;border-top:1px solid var(--grid);padding-top:14px}
.navsteps button{border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;background:var(--head);color:var(--ink);font-weight:600}
.navsteps button.pri{background:var(--azul);color:#fff}
.navsteps button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--grid);display:block}
.dots i.on{background:var(--azul)}
/* escenario */
.stage{display:flex;flex-direction:column;gap:12px}
.estado{display:flex;align-items:center;gap:12px;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:600}
.estado.mira{background:var(--azul2);color:var(--navy)}
.estado.haz{background:var(--ambar2);color:#5c4700}
.estado.calc{background:#fff4e5;color:#8a4b00}
.estado.listo{background:var(--verde2);color:#14532d}
.estado .ic{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:none;background:#fff}
.estado.calc .ic{border:3px solid #f0b060;border-top-color:transparent;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.estado button{margin-left:auto;border:0;border-radius:8px;padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.estado button:disabled{opacity:.4;cursor:default}
.estado input[type=range]{width:200px}
.lienzo{flex:1;display:flex;flex-direction:column;gap:12px}
.dos{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px}
@media (max-width:1200px){.dos{grid-template-columns:1fr}}
.nota{background:var(--celda);border:1px solid var(--grid);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.5}
.nota b{color:var(--navy)}
.nota .grande{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1;margin:4px 0}
.nota .op{font-size:14px;color:var(--muted)}
.nota.ambar{background:var(--ambar2);border-color:#f0d58a;color:#5c4700}
.nota.verde{background:var(--verde2);border-color:#b7dcc1;color:#14532d}
.nota.ambar b,.nota.verde b{color:inherit}
/* tablas */
table.datos{border-collapse:separate;border-spacing:3px;font-size:15px;font-variant-numeric:tabular-nums}
table.datos th{background:var(--head);color:var(--muted);font-weight:700;padding:8px 12px;text-align:left;border-radius:5px}
table.datos td{background:var(--celda);padding:8px 12px;border-radius:5px}
table.datos td.num{text-align:right}
table.datos .hi{background:var(--azul2)!important;color:var(--azul);font-weight:700}
table.datos .hi2{background:var(--ambar2)!important;color:#5c4700;font-weight:700}
table.datos tr.dim td{opacity:.35}
/* filas de celdas grandes */
.fila{display:grid;grid-template-columns:150px 64px repeat(24,1fr);gap:3px;align-items:center;font-variant-numeric:tabular-nums}
.fila .tec{font-size:12px;font-weight:700;padding:3px 6px;border-radius:4px;text-align:center}
.fila.sinnum .cel, .fila.chica.sinnum .cel{height:22px;padding:0;font-size:0;line-height:22px}
.fila.sinnum .cel:hover{outline:2px solid var(--ink)}
.fila .rot{font-size:14px;font-weight:700;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .hh{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.fila .cel{text-align:center;border-radius:5px;padding:9px 0;font-size:12.5px;color:#fff;font-weight:600;transition:all .4s}
.fila .cel.dark{color:var(--ink)}
.fila.chica .cel{padding:4px 0;font-size:11px}
.fila.chica .rot{font-size:12.5px;font-weight:600}
.fila .cel.off{opacity:.15}
.fila .hh.on{background:var(--ambar2);color:#5c4700;border-radius:4px}
.fila .rot.on{color:var(--azul)}
.tira{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;height:90px}
.tira i{display:block;width:5px;background:var(--azul);opacity:.7;border-radius:1px 1px 0 0}
svg text{font-family:inherit}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:13px;height:13px;border-radius:50%;display:inline-block}
.cross{border-collapse:separate;border-spacing:2px;font-size:14px;font-variant-numeric:tabular-nums}
.cross th{background:var(--head);color:var(--muted);padding:4px 10px;border-radius:4px;font-weight:700}
.cross td{background:var(--celda);padding:4px 10px;text-align:center;border-radius:4px;min-width:46px}
.cross td.z{color:#c0c4c8}
.cross td.v{background:var(--azul2);color:var(--azul);font-weight:700}
.cross td.r{background:var(--rojo2);color:var(--rojo);font-weight:700}
.cross td.t{text-align:left;font-weight:700}
.portada{display:flex;flex-direction:column;justify-content:center;padding:10px 6px}
.portada h3{font-size:30px;margin:0 0 10px;color:var(--navy);line-height:1.15}
.portada p{font-size:18px;max-width:680px}
.preg{display:grid;gap:10px;margin-top:14px;max-width:680px}
.preg div{background:var(--azul2);border-radius:10px;padding:10px 14px;font-size:16px;color:var(--navy);display:flex;gap:10px}
.preg b{background:var(--azul);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.mas{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.mas button{border:1px solid var(--grid);background:#fff;border-radius:999px;padding:8px 14px;font-size:14.5px;cursor:pointer;color:var(--navy);font-weight:600}
.mas button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.masbox{background:#fff;border:1px solid var(--navy);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.5}
.masbox b{color:var(--navy)}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:10px 0 24px}
kbd{border:1px solid var(--grid);border-radius:4px;padding:0 5px;background:#fff;font-size:12px}
.parpadea{animation:pp .5s 3}
@keyframes pp{50%{opacity:.15}}
</style>
</head>

  { tx:`<p>Un supermercado revisa sus boletas y descubre que <b>9 de cada 10 boletas con pan</b> traen también leche. Alguien dice, el pan hace vender leche.</p><p>Otro pregunta, ¿y en las boletas sin pan? La leche está en <b>9 de cada 10 boletas de todo el supermercado</b>, con pan o sin pan.</p><p class="remate">La leche se vende sola. Los 9 de cada 10 parecían una regla, pero era la costumbre de siempre.</p>`,
    mas:[["¿Dónde está la trampa?","En mirar solo las boletas con pan. Un número alto con la condición no dice nada si sin la condición es igual de alto. Siempre hay que preguntar, ¿y en todas? Eso es lo normal del Capítulo 2."]],
    st(){ estado("mira","Pan y leche. Dos cuentas, el mismo resultado."); lienzo(h("div",{class:"dos",style:"grid-template-columns:1fr 1fr"}, tarjetaBoletas("Boletas con pan", [{t:"traen leche", n:9, de:10}], "#d99a00"), tarjetaBoletas("Todas las boletas del supermercado", [{t:"traen leche", n:9, de:10}], "#5f6368")), nota(`9 de 10 con pan, 9 de 10 en general. <b>El pan no cambia nada.</b> La leche estaba en la boleta de todas formas.`)); } },
  { tx:`<p>Otra pareja. En las boletas con <b>carbón</b>, los fósforos aparecen en <b>8 de cada 10</b>. En todas las boletas, los fósforos aparecen solo en <b>2 de cada 10</b>.</p><p>Con carbón, los fósforos aparecen <b>4 veces más seguido</b> que de costumbre. Ahí sí hay algo. Quien lleva carbón, lleva fósforos.</p>`,
    mas:[["Los tres nombres","A lo de todas las boletas, 2 de cada 10, le dijimos lo normal, los libros le dicen soporte. A lo que pasa con la condición, 8 de cada 10, se le llama confianza. Y a cuántas veces más que lo normal, 8 dividido por 2, cuatro, se le llama lift. Con pan y leche el lift era 9 dividido por 9, uno. Lift uno es la costumbre de siempre."]],
    st(){ estado("mira","Carbón y fósforos. Dos cuentas, resultado distinto."); lienzo(h("div",{class:"dos",style:"grid-template-columns:1fr 1fr"}, tarjetaBoletas("Boletas con carbón", [{t:"traen fósforos", n:8, de:10}], "#d99a00"), tarjetaBoletas("Todas las boletas del supermercado", [{t:"traen fósforos", n:2, de:10}], "#5f6368")), nota(`<div class="op">8 de 10 contra 2 de 10</div><div class="grande">4 veces más que lo normal</div>Esto sí es una regla. En el cuaderno a ese 4 se le llama <b>lift</b>, y al 8 de 10, <b>confianza</b> de la regla si hay carbón, entonces fósforos.`)); } },
  { tx:`<p>Ahora con la bitácora. La pregunta uno. Si en un mes hubo <b>falla eléctrica</b>, ¿aparece también el <b>correctivo</b> más que de costumbre?</p><p>Haz clic en <b>Contar</b> y mira las canastas. Primero se marcan las que tienen falla eléctrica, después, entre esas, las que además tienen correctivo.</p>`,
    mas:[["¿Y esto en el cuaderno?","Es el Paso 4. Filtra las canastas con el primer evento, cuenta cuántas tienen también el segundo, y divide. Después divide ese resultado por lo normal del segundo. Dos divisiones."]],
    st(){ const w=h("div",{},rejillaCanastas({})); const btn=h("button",{},"Contar"); estado("haz","Haz clic en Contar.",btn); const n=nota(`<div class="op">si hay falla eléctrica, entonces correctivo</div><div class="grande" id="ng">…</div><span id="ntx">Esperando.</span>`); lienzo(h("div",{class:"col"},n,w));
      btn.onclick=async()=>{ btn.disabled=true; const tk=token; const {nA,nAB}=contarCanastas("falla_electrica","correctivo"); w.innerHTML=""; w.append(rejillaCanastas({a:"falla_electrica"})); $("#ng").textContent=`${nA} canastas`; $("#ntx").innerHTML="con falla eléctrica. Son las que quedan encendidas."; estado("calc","Contando las canastas con falla eléctrica."); await sleep(1800); if(tk!==token) return;
        w.innerHTML=""; w.append(rejillaCanastas({a:"falla_electrica",b:"correctivo"})); $("#ng").textContent=`${nAB} de ${nA}`; $("#ntx").innerHTML=`tienen además correctivo, con borde rojo. Es el <b>${pct(nAB/nA)}</b>. Esa es la confianza.<br><br>Lo normal del correctivo era <b>40,0 %</b>. ${pct(nAB/nA)} dividido por 40,0 % da <b>lift ${es(nAB/nA/D.soporte.correctivo,2)}</b>. En los meses con falla eléctrica el correctivo aparece <b>el doble</b> de lo normal.`; estado("listo","Lift 2,08. Falla eléctrica y correctivo van juntos más que de costumbre."); }; } },
  { tx:`<p>Tu turno. Elige dos eventos y mira si van juntos más que de costumbre.</p><p>Prueba <b>falla eléctrica</b> con <b>preventivo</b>. Parece una regla, 52,4 %, pero el preventivo ya estaba en el 56,3 % de todas las canastas. Es pan con leche.</p>`,
    mas:[["¿Cuánto lift es mucho?","No hay una cifra fija. Lift 1 es la costumbre. Menos de 1,2 casi nunca vale la pena. Sobre 1,5 ya hay algo que mirar, y sobre 2 es una regla clara. Pero siempre con cuántas canastas se contó, con 5 canastas cualquier número sale."],["¿La regla tiene dirección?","Si hay A entonces B no es lo mismo que si hay B entonces A. La confianza cambia, porque se divide por canastas distintas. El lift, en cambio, da igual en las dos direcciones. Pruébalo con correctivo y falla eléctrica."]],
    st(){ const sa=h("select",{style:"font-size:15px;padding:4px 8px;border-radius:6px"}), sb=h("select",{style:"font-size:15px;padding:4px 8px;border-radius:6px"}); EV.forEach(e=>{ sa.append(h("option",{value:e},EVN[e])); sb.append(h("option",{value:e},EVN[e])); }); sa.value="falla_electrica"; sb.value="preventivo";
      const ctrl=h("span",{style:"margin-left:auto;display:flex;gap:8px;align-items:center"},"si hay",sa,"entonces",sb); estado("haz","Elige dos eventos.",ctrl); const w=h("div",{}); const n=nota(""); lienzo(h("div",{class:"col"},n,w));
      const pinta=()=>{ const a=sa.value,b=sb.value; if(a===b){ n.innerHTML="Elige dos eventos distintos."; return; } const {nA,nAB}=contarCanastas(a,b); const conf=nAB/nA, lift=conf/D.soporte[b]; w.innerHTML=""; w.append(rejillaCanastas({a,b})); n.innerHTML=`<div class="op">si hay ${EVN[a]}, entonces ${EVN[b]}</div><div class="grande">lift ${es(lift,2)}</div>Canastas con ${EVN[a]}, <b>${nA}</b>. De esas, con ${EVN[b]} también, <b>${nAB}</b>. Confianza <b>${pct(conf)}</b>.<br>Lo normal de ${EVN[b]}, <b>${pct(D.soporte[b])}</b>.<br><br>${lift>=1.5? "<b>Van juntos más que de costumbre.</b> Esto es una regla." : lift>=1.2? "Un poco más que de costumbre. Hay algo, pero débil." : "<b>Es la costumbre de siempre.</b> Pan con leche, no es una regla."}`; };
      sa.onchange=pinta; sb.onchange=pinta; pinta(); } },
  { tx:`<p>Todas las parejas de una vez, ordenadas por lift. Arriba las que de verdad van juntas, abajo las que van juntas menos que de costumbre.</p><p>Falla eléctrica y correctivo está arriba, en las dos direcciones. Falla eléctrica con preventivo está cerca de 1.</p>`,
    mas:[["¿Lift menor que 1?","Significa que cuando hay uno, el otro aparece menos que de costumbre. También es información. Si en los meses con evento climático hay menos inspecciones, puede que las inspecciones se posterguen por el clima."],["¿Y esto en el cuaderno?","Es el Estudio 3 de la sección Para estudiar. Calcula el lift de todas las parejas con un ciclo, sin probarlas una por una."]],
    st(){ estado("mira","Las 30 parejas, de mayor a menor lift."); const t=h("table",{class:"datos",style:"font-size:14px"}); t.append(h("tr",{},...["si hay","entonces","canastas","confianza","lo normal","lift"].map(c=>h("th",{class:c==="lift"?"hi":""},c))));
      D.pares.slice().sort((x,y)=>y.lift-x.lift).forEach(p=>t.append(h("tr",{},h("td",{},chip(p.a)),h("td",{},chip(p.b)),h("td",{class:"num"},String(p.n)),h("td",{class:"num"},pct(p.conf)),h("td",{class:"num"},pct(D.soporte[p.b])),h("td",{class:"num "+(p.lift>=1.5?"hi":p.lift<=0.7?"hi2":"")},es(p.lift,2)))));
      lienzo(h("div",{class:"dos"}, t, nota(`Aquí todas las parejas tienen al menos 42 canastas con el primer evento, así que los lift son de fiar. Con menos de 20 canastas, el lift sale de cualquier cosa.<br><br>Fíjate que el lift es el mismo en las dos direcciones, falla eléctrica y correctivo da <b>2,08</b> en ambas. Lo que cambia es la confianza.`))); } },
]},
{ n:"Capítulo 4", t:"¿En cuántos días llega el correctivo?", pasos:[
  { tx:`<p>La canasta junta todo lo que pasó en un mes, pero <b>no sabe en qué orden</b>. Para saber qué viene después de qué, se ordena la bitácora por fecha y, al lado de cada evento, se anota el que vino justo después en esa central.</p><p>De las <span class="dato">47 fallas eléctricas</span> del año, esto es lo que vino después de cada una.</p>`,
    mas:[["¿Y esto en el cuaderno?","Es shift, que corre una columna una fila hacia arriba. Con la bitácora ordenada por central y fecha, el evento siguiente queda al lado del actual. Y la diferencia de fechas da los días. Es el Paso 5 y el Estudio 4."],["¿Por qué 47 y no 42?","En el Capítulo 3 eran 42 canastas con falla eléctrica, porque una canasta junta un mes. Aquí son los 47 eventos uno por uno, porque algunas centrales tuvieron dos fallas en el mismo mes."]],
    st(){ estado("mira","Las 47 fallas eléctricas y lo que vino después de cada una, en la misma central."); const cuenta={}; D.fe.forEach(r=>cuenta[r.sig]=(cuenta[r.sig]||0)+1); const res=h("div",{style:"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"}); Object.entries(cuenta).sort((a,b)=>b[1]-a[1]).forEach(([e,n])=>res.append(h("div",{style:`border-left:5px solid ${EVC[e]};background:var(--celda);border-radius:0 8px 8px 0;padding:6px 10px;font-size:14px`},h("b",{},String(n))," veces ",EVN[e])));
      lienzo(res, nota(`En <b>${cuenta.correctivo} de 47</b>, el <b>${pct(cuenta.correctivo/47)}</b>, lo siguiente que pasó fue un correctivo. Pero la pregunta de mantenimiento no es si llega, es <b>cuándo</b>. Mira la columna días.`), tablaFallas()); } },
  { tx:`<p>Llamaste al plomero diez veces en el año. ¿Llega a tiempo? Depende de qué llames a tiempo. Si a tiempo es el mismo día, llegó 2 de 10 veces. Si es dentro de 3 días, 9 de 10. Son los mismos diez llamados.</p><p class="remate">El plazo que uno elige cambia la respuesta. Por eso el plazo se dice siempre junto con el resultado.</p>`,
    st(){ estado("mira","El mismo plomero, dos plazos, dos respuestas."); lienzo(h("div",{class:"dos",style:"grid-template-columns:1fr 1fr"}, tarjetaBoletas("A tiempo es el mismo día", [{t:"llegó a tiempo", n:2, de:10}], "#c5221f"), tarjetaBoletas("A tiempo es dentro de 3 días", [{t:"llegó a tiempo", n:9, de:10}], "#188038")), nota(`Ninguna de las dos respuestas es mentira. Pero decir que el plomero llega a tiempo 9 de 10 veces, sin decir que el plazo son 3 días, sí engaña.`)); } },
  { tx:`<p>Con las 47 fallas eléctricas. Mueve el <b>plazo</b> y mira cuántas tuvieron su correctivo dentro de ese plazo.</p><p>Con el mismo día, 7. Con 3 días, <span class="dato">32 de 47</span>, 7 de cada 10. Y del día 4 al 7 no se suma ninguna más. Si no llegó en 3 días, no llega pronto.</p>`,
    mas:[["¿Por qué se detiene en 32?","Porque las otras 15 fallas tuvieron después otra cosa, un preventivo, una inspección, otra falla, y el correctivo que vino más tarde ya no cuenta como lo siguiente. O el correctivo llegó a los 11, 16, 18 o 33 días. Para una cuadrilla, eso no es pronto."],["¿Y esto en el cuaderno?","Es el deslizador del Paso 5. Cambia el plazo, vuelve a correr la celda y la cuenta cambia. En clase se prueba con 1, 3 y 7."]],
    st(){ const sl=h("input",{type:"range",min:0,max:7,value:3}); const val=h("span",{style:"font-weight:800;font-size:18px;min-width:70px"}); const ctrl=h("span",{style:"margin-left:auto;display:flex;gap:10px;align-items:center"},"plazo",sl,val); estado("haz","Mueve el plazo.",ctrl); const w=h("div",{}); const n=nota(""); const tab=h("div",{}); lienzo(h("div",{class:"dos"},w,n),tab);
      const pinta=()=>{ const k=+sl.value; val.textContent=k===0?"mismo día":k+(k===1?" día":" días"); const v=D.plazo[k]; w.innerHTML=""; w.append(graficoPlazo(k)); n.innerHTML=`<div class="op">correctivo dentro de ${k===0?"el mismo día":k+" días"}</div><div class="grande">${v} de 47</div>El <b>${pct(v/47)}</b> de las fallas eléctricas. ${k>=3&&k<7? "Desde aquí no se suma ninguna más hasta el día 7." : k===7? "Igual que con 3 días. Entre el día 4 y el 7 no llegó ningún correctivo." : "Sube el plazo y mira cómo cambia."}`; tab.innerHTML=""; tab.append(tablaFallas(k)); };
      sl.oninput=pinta; pinta(); } },
]},
{ n:"Cierre", t:"Las respuestas para mantenimiento", pasos:[
  { tx:`<p>Las dos preguntas, respondidas con la bitácora.</p><p><b>1.</b> Sí, van juntos. En los meses con falla eléctrica el correctivo aparece el doble de lo normal, lift 2,08. Y en 8 de cada 10 fallas es lo siguiente que pasa.</p><p><b>2.</b> En 7 de cada 10 fallas, el correctivo llega dentro de los 3 días siguientes. Entre el día 4 y el 7 no llega ninguno más.</p>`,
    st(){ estado("mira","Lo que se lleva mantenimiento."); lienzo(h("div",{class:"portada"}, nota(`<b>Qué conviene hacer.</b> Después de una falla eléctrica, tener una cuadrilla lista para los 3 días siguientes. Si en 3 días no la llamaron, lo más probable es que no la llamen pronto.`,"verde"), h("div",{style:"height:14px"}), nota(`<b>Las tres ideas en una frase.</b> Lo normal es la costumbre de cada evento. Una regla es cuando con una condición un evento aparece bastante más que lo normal, y el lift dice cuántas veces más. Y el plazo se dice siempre junto con el resultado.`))); } },
  { tx:`<p>Ahora, al Colab. El cuaderno guiado tiene cinco pasos en clase, los Pasos 1 y 2 arman las canastas y los Pasos 3, 4 y 5 son estos tres capítulos. Los cuatro estudios quedan para la casa, empezando por el Estudio 4, que es la secuencia.</p>`,
    st(){ estado("mira","El cuaderno del Lab 04 guiado."); lienzo(h("div",{class:"portada"}, h("h3",{},"Lab 04 guiado"), h("p",{},"Paso 3, lo normal de cada evento. Paso 4, si pasa una cosa, pasa la otra, con el lift. Paso 5, en cuántos días llega el correctivo. Para la casa, los Estudios 1 a 4."), h("p",{}, h("a",{href:"https://colab.research.google.com/github/RodrigoMSB/curso-python-minergia/blob/main/modulos/modulo04/lab_guiado.ipynb",target:"_blank",style:"color:var(--azul);font-weight:700"},"Abrir el Lab 04 guiado en Colab")))); } },
]},
];


let cap=0, paso=0;
function render(){
  const C=CAPS[cap], P=C.pasos[paso]; nuevoToken();
  $("#capnum").textContent = C.n; $("#h2").textContent = C.t; $("#texto").innerHTML = P.tx;
  P.st();
  if (P.mas){ const caja=h("div",{class:"masbox",style:"display:none"}); const fila=h("div",{class:"mas"}); P.mas.forEach(([t,html],i)=>{ const b=h("button",{},t); b.onclick=()=>{ const on=b.classList.contains("on"); fila.querySelectorAll("button").forEach(x=>x.classList.remove("on")); if(on){ caja.style.display="none"; } else { b.classList.add("on"); caja.innerHTML=html; caja.style.display="block"; } }; fila.append(b); }); $("#lienzo").append(h("div",{style:"font-size:13px;color:var(--muted);margin-top:6px"},"Para saber más, toca un botón."), fila, caja); }
  $("#prev").disabled = cap===0 && paso===0; $("#next").disabled = cap===CAPS.length-1 && paso===C.pasos.length-1;
  $("#next").textContent = paso===C.pasos.length-1 && cap<CAPS.length-1 ? "Siguiente capítulo" : "Siguiente";
  const d=$("#dots"); d.innerHTML=""; C.pasos.forEach((_,i)=>d.append(h("i",{class:i===paso?"on":""})));
  document.querySelectorAll("#caps button").forEach((b,i)=>b.classList.toggle("on",i===cap));
  window.scrollTo({top:0,behavior:"smooth"});
}
function ir(d){ if(d>0){ if(paso<CAPS[cap].pasos.length-1) paso++; else if(cap<CAPS.length-1){cap++;paso=0;} } else { if(paso>0) paso--; else if(cap>0){cap--;paso=CAPS[cap].pasos.length-1;} } render(); }
$("#prev").onclick=()=>ir(-1); $("#next").onclick=()=>ir(1);
document.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return; if(e.key==="ArrowRight") ir(1); if(e.key==="ArrowLeft") ir(-1); });
CAPS.forEach((c,i)=>$("#caps").append(h("button",{onclick:()=>{cap=i;paso=0;render();}}, i===0?"Inicio": i===CAPS.length-1?"Cierre":"Cap. "+i)));
render();
</script>
