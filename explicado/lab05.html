<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 05 · Agrupar sin respuesta correcta</title>
<style>
:root{--ink:#202124;--muted:#5f6368;--grid:#dadce0;--surf:#fff;--head:#f1f3f4;--celda:#f8f9fa;--navy:#0b3d62;
--azul:#1a73e8;--azul2:#e8f0fe;--ambar:#d99a00;--ambar2:#fef3d6;--verde:#188038;--verde2:#e6f4ea;--rojo:#c5221f;--rojo2:#fce8e6;--morado:#7b4fc9;--gris:#80868b;}
*{box-sizing:border-box}
html,body{margin:0;background:#f4f5f7;color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:700}
header .sub{font-size:13px;opacity:.8}
nav.caps{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav.caps button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
nav.caps button.on{background:#fff;color:var(--navy);font-weight:700}
main{display:grid;grid-template-columns:390px 1fr;gap:18px;padding:18px 24px;max-width:1540px;margin:0 auto;align-items:start}
@media (max-width:980px){main{grid-template-columns:1fr;padding:12px 16px}}
.panel{background:var(--surf);border:1px solid var(--grid);border-radius:14px;padding:20px 22px}
.story{display:flex;flex-direction:column;position:sticky;top:12px}
.capnum{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.story h2{font-size:23px;margin:4px 0 14px;line-height:1.2}
.story .texto{font-size:17.5px}
.story .texto p{margin:0 0 12px}
.story .texto b{color:var(--navy)}
.dato{display:inline;background:var(--ambar2);color:#5c4700;border-radius:6px;padding:0 6px;font-weight:700}
.remate{background:var(--ambar2);border-left:6px solid var(--ambar);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0 0;color:#5c4700;font-weight:600}
.navsteps{display:flex;align-items:center;gap:10px;margin-top:14px;border-top:1px solid var(--grid);padding-top:14px}
.navsteps button{border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;background:var(--head);color:var(--ink);font-weight:600}
.navsteps button.pri{background:var(--azul);color:#fff}
.navsteps button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--grid);display:block}
.dots i.on{background:var(--azul)}
/* escenario */
.stage{display:flex;flex-direction:column;gap:12px}
.estado{display:flex;align-items:center;gap:12px;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:600}
.estado.mira{background:var(--azul2);color:var(--navy)}
.estado.haz{background:var(--ambar2);color:#5c4700}
.estado.calc{background:#fff4e5;color:#8a4b00}
.estado.listo{background:var(--verde2);color:#14532d}
.estado .ic{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:none;background:#fff}
.estado.calc .ic{border:3px solid #f0b060;border-top-color:transparent;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.estado button{margin-left:auto;border:0;border-radius:8px;padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.estado button:disabled{opacity:.4;cursor:default}
.estado input[type=range]{width:200px}
.lienzo{flex:1;display:flex;flex-direction:column;gap:12px}
.dos{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px}
@media (max-width:1200px){.dos{grid-template-columns:1fr}}
.nota{background:var(--celda);border:1px solid var(--grid);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.5}
.nota b{color:var(--navy)}
.nota .grande{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1;margin:4px 0}
.nota .op{font-size:14px;color:var(--muted)}
.nota.ambar{background:var(--ambar2);border-color:#f0d58a;color:#5c4700}
.nota.verde{background:var(--verde2);border-color:#b7dcc1;color:#14532d}
.nota.ambar b,.nota.verde b{color:inherit}
/* tablas */
table.datos{border-collapse:separate;border-spacing:3px;font-size:15px;font-variant-numeric:tabular-nums}
table.datos th{background:var(--head);color:var(--muted);font-weight:700;padding:8px 12px;text-align:left;border-radius:5px}
table.datos td{background:var(--celda);padding:8px 12px;border-radius:5px}
table.datos td.num{text-align:right}
table.datos .hi{background:var(--azul2)!important;color:var(--azul);font-weight:700}
table.datos .hi2{background:var(--ambar2)!important;color:#5c4700;font-weight:700}
table.datos tr.dim td{opacity:.35}
/* filas de celdas grandes */
.fila{display:grid;grid-template-columns:150px 64px repeat(24,1fr);gap:3px;align-items:center;font-variant-numeric:tabular-nums}
.fila .tec{font-size:12px;font-weight:700;padding:3px 6px;border-radius:4px;text-align:center}
.fila.sinnum .cel, .fila.chica.sinnum .cel{height:22px;padding:0;font-size:0;line-height:22px}
.fila.sinnum .cel:hover{outline:2px solid var(--ink)}
.fila .rot{font-size:14px;font-weight:700;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .hh{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.fila .cel{text-align:center;border-radius:5px;padding:9px 0;font-size:12.5px;color:#fff;font-weight:600;transition:all .4s}
.fila .cel.dark{color:var(--ink)}
.fila.chica .cel{padding:4px 0;font-size:11px}
.fila.chica .rot{font-size:12.5px;font-weight:600}
.fila .cel.off{opacity:.15}
.fila .hh.on{background:var(--ambar2);color:#5c4700;border-radius:4px}
.fila .rot.on{color:var(--azul)}
.tira{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;height:90px}
.tira i{display:block;width:5px;background:var(--azul);opacity:.7;border-radius:1px 1px 0 0}
svg text{font-family:inherit}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:13px;height:13px;border-radius:50%;display:inline-block}
.cross{border-collapse:separate;border-spacing:2px;font-size:14px;font-variant-numeric:tabular-nums}
.cross th{background:var(--head);color:var(--muted);padding:4px 10px;border-radius:4px;font-weight:700}
.cross td{background:var(--celda);padding:4px 10px;text-align:center;border-radius:4px;min-width:46px}
.cross td.z{color:#c0c4c8}
.cross td.v{background:var(--azul2);color:var(--azul);font-weight:700}
.cross td.r{background:var(--rojo2);color:var(--rojo);font-weight:700}
.cross td.t{text-align:left;font-weight:700}
.portada{display:flex;flex-direction:column;justify-content:center;padding:10px 6px}
.portada h3{font-size:30px;margin:0 0 10px;color:var(--navy);line-height:1.15}
.portada p{font-size:18px;max-width:680px}
.preg{display:grid;gap:10px;margin-top:14px;max-width:680px}
.preg div{background:var(--azul2);border-radius:10px;padding:10px 14px;font-size:16px;color:var(--navy);display:flex;gap:10px}
.preg b{background:var(--azul);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.mas{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.mas button{border:1px solid var(--grid);background:#fff;border-radius:999px;padding:8px 14px;font-size:14.5px;cursor:pointer;color:var(--navy);font-weight:600}
.mas button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.masbox{background:#fff;border:1px solid var(--navy);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.5}
.masbox b{color:var(--navy)}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:10px 0 24px}
kbd{border:1px solid var(--grid);border-radius:4px;padding:0 5px;background:#fff;font-size:12px}
.parpadea{animation:pp .5s 3}
@keyframes pp{50%{opacity:.15}}
</style>
</head>

    st(){ estado("mira","Dos filas, dos centrales. Mismas 24 horas."); lienzo(cabeceraHoras(), filaCeldas(D.perfil[iCosta],{rot:"Costa Brava",tec:"carbon",max:310,dec:0}), filaCeldas(D.perfil[iVega],{rot:"Vega Azul",tec:"hidro",max:310,dec:0}), nota(`Costa Brava ronda los <b>${Math.round(D.perfil[iCosta][12])} MWh</b> a toda hora y Vega Azul los <b>${Math.round(D.perfil[iVega][12])}</b>. Una genera seis veces más que la otra. Guarda ese dato, vuelve en el Capítulo 2.`)); } },
  { tx:`<p>Y con las 20 centrales queda la tabla completa. <b>20 filas</b>, una por central, <b>24 columnas</b>, una por hora. 480 celdas, cada una un promedio de 366 días.</p><p>En el cuaderno esta tabla se llama <b>perfil</b>.</p>`,
    mas:[["¿Qué es una tabla dinámica?",`Esta tabla es una tabla dinámica, como las de Excel. Las filas son las centrales, las columnas las horas y cada celda un promedio. En pandas se hace con pivot_table, que vimos en el Lab 02. Es la misma idea.`],["¿Por qué agrupadas por tipo?",`Para que se vean las familias. En el cuaderno las filas salen en orden alfabético, y las familias igual existen, solo que hay que buscarlas. Aquí van juntas para que el ojo las encuentre.`]],
    st(){ estado("mira","Las 20 filas, agrupadas por tipo de central. Mira los colores. Si quieres el número, pasa el mouse por la celda."); lienzo(h("div",{class:"col"}, nota(`<b>Qué mirar.</b> Las filas van juntas por tipo de central, la segunda columna lo dice. Carbón, gas e hidro son azul parejo de punta a punta, trabajan lo mismo a toda hora. Las solares solo se pintan al medio, de las 9 a las 16. Las eólicas y Vega Azul se ven casi blancas, porque generan poco.`), tablaFilas(D.perfil,{max:310,dec:0,sinNum:true}))); } },
  { tx:`<p>Fijémonos en unas columnas. De las <b>9 a las 14</b>, el centro del día.</p><p>Las solares están en su mejor momento. El diésel está en cero, porque solo entra en la tarde. Carbón, gas e hidro no se enteran de la hora.</p><p>En el cuaderno, estas son las columnas que muestra la primera celda.</p>`,
    st(){ estado("mira","Las columnas de las 9 a las 14. El resto queda apagado."); lienzo(h("div",{class:"col"}, nota(`<b>Una columna es una hora</b> del día promedio de todas las centrales.<br><br>Mira Altiplano, Llano Seco y las demás solares. Entre las 9 y las 14 están en lo más alto de su día, Altiplano llega a 82 MWh. Y Respaldo Cordillera, el diésel, está en 0 todo ese rato.`), tablaFilas(D.perfil,{max:310,dec:0,colsOn:[9,10,11,12,13,14],sinNum:true}))); } },
]},
{ n:"Capítulo 2", t:"La forma, no el tamaño", pasos:[
  { tx:`<p>Volvamos a Costa Brava y Vega Azul. Las dos trabajan parejo todo el día, pero una genera <span class="dato">6 veces más</span>.</p><p>Si las comparamos en megawatts, parecen distintas. Pero esa diferencia es de <b>tamaño</b>, no de forma de trabajar.</p>`,
    mas:[["¿Seis veces más de qué?",`De energía por hora. Costa Brava genera unos 307 MWh cada hora y Vega Azul unos 52. Pero Costa Brava tiene 480 MW de potencia y Vega Azul 95. Las dos usan más o menos la misma parte de lo que pueden. La diferencia es el tamaño de la central, no su forma de trabajar.`]],
    st(){ estado("mira","Las mismas dos filas, dibujadas como curvas. Una hora por punto."); lienzo(h("div",{class:"col"}, curvas([{y:D.perfil[iCosta],color:TEC.carbon[1],nombre:"Costa Brava",lx:12},{y:D.perfil[iVega],color:TEC.hidro[1],nombre:"Vega Azul",lx:12}],{ymax:340,ylabel:"MWh promedio en esa hora",h:380}), nota(`<b>Las dos curvas son planas.</b> Esa es la forma, trabajar parejo.<br><br>Lo que las separa es la altura. Costa Brava tiene <b>480 MW</b> de potencia y Vega Azul <b>${centrales[iVega].p} MW</b>. Una es una central grande, la otra una pequeña.`))); } },
  { tx:`<p>Para comparar la forma hay que quitar el tamaño. Se <b>divide cada fila por la potencia</b> de su central.</p><p>Costa Brava genera 307 MWh con 480 MW de potencia. 307 dividido por 480 es <span class="dato">0,64</span>. Usa el 64 por ciento de lo que puede.</p>`,
    mas:[["¿Puede dar más de 1?",`En la práctica no, porque una central no puede generar más que su potencia. Si saliera más de 1 habría un error en los datos, por ejemplo una potencia mal anotada en centrales.csv. Es una buena comprobación.`],["¿Y esto en el cuaderno?",`Es la línea factor = perfil.div(potencia, axis=0). Divide cada fila de perfil por la potencia de su central. axis=0 le dice que la división va fila por fila.`]],
    st(){ estado("mira","La cuenta, celda por celda. Mira cómo la fila cambia de unidad."); const w=h("div",{}); w.append(cabeceraHoras(), filaCeldas(D.perfil[iCosta],{rot:"Costa Brava, MWh",tec:"carbon",max:310,dec:0})); const f2=filaCeldas(D.factor[iCosta],{rot:"dividida por 480",tec:"carbon",max:0.72,dec:2}); f2.style.opacity=0; f2.style.transition="opacity .8s"; w.append(h("div",{style:"text-align:center;color:var(--muted);font-size:14px;padding:4px"},"cada celda dividida por 480 MW"), f2); setTimeout(()=>f2.style.opacity=1,500);
      lienzo(h("div",{class:"col"}, w, nota(`<div class="op">Costa Brava a las 9</div><div class="grande">307 ÷ 480 = 0,64</div>Ahora cada celda dice <b>qué parte de su potencia</b> usa la central a esa hora. Un número entre 0 y 1.<br><br>Para Vega Azul la cuenta es 52 ÷ 95 = <b>0,55</b>.`))); } },
  { tx:`<p>Divididas por su potencia, las dos curvas <b>tienen la misma forma</b> y casi la misma altura. Costa Brava al 64 por ciento, Vega Azul al 55.</p><p class="remate">Ahora sí se comparan por cómo trabajan, no por cuánto pesan.</p>`,
    st(){ estado("mira","Las mismas dos centrales, ahora en parte de su potencia."); lienzo(h("div",{class:"col"}, curvas([{y:D.factor[iCosta],color:TEC.carbon[1],nombre:"Costa Brava, 0,64",lx:6},{y:D.factor[iVega],color:TEC.hidro[1],nombre:"Vega Azul, 0,55",lx:17}],{ymax:1,ylabel:"parte de su potencia que usa",fmt:v=>es(v,2),h:380}), nota(`Antes una curva estaba seis veces más arriba que la otra. Ahora están juntas.<br><br>Lo que quedó es <b>la forma</b>. Y las dos tienen la misma, plana de punta a punta.`))); } },
  { tx:`<p>Hecho para las 20 centrales, queda la tabla que ve el algoritmo. En el cuaderno se llama <b>factor</b>. Mismas 20 filas y 24 columnas, cada número entre 0 y 1.</p><p>Ya se ven cuatro familias de formas.</p>`,
    mas:[["¿Las eólicas son parejas de verdad?",`En promedio sí, porque el viento sopla a cualquier hora. Pero cada día es distinto. El promedio esconde esa variación, y por eso en el Capítulo 4 las eólicas quedan fuera de todo grupo cuando se miran día por día.`]],
    st(){ estado("mira","La tabla factor, por tipo de central. Vega Azul ya se ve igual que las otras hidro."); lienzo(h("div",{class:"col"}, nota(`<b>Cuatro formas.</b> Azul parejo todo el día, carbón, gas e hidro. Azul solo al mediodía, las solares. Azul solo en la tarde, el diésel. Y las eólicas, parejas pero más bajas, en promedio usan un tercio de su potencia a cualquier hora. Mira cómo cada tipo de central tiene su propia forma.`), tablaFilas(D.factor,{max:0.72,dec:2,sinNum:true}))); } },
  { tx:`<p>Un último arreglo. Si en una hora todas las centrales se parecen y en otra difieren mucho, la segunda hora pesaría más al comparar. Para evitarlo, cada columna se deja <b>centrada en cero</b>, y además se achica o se estira para que en todas las horas las centrales se separen más o menos lo mismo.</p><p>Azul es estar sobre el promedio de esa hora, rojo es estar debajo. En el cuaderno esto lo hace una herramienta llamada StandardScaler.</p>`,
    mas:[["¿Qué hace exactamente?",`Para cada columna calcula el promedio y cuánto se dispersan los valores. Le resta el promedio a cada celda, así el centro queda en cero, y divide por la dispersión, así todas las columnas quedan con la misma. Es lo que hace StandardScaler en el cuaderno, en una sola línea.`],["¿Es obligatorio?",`Para K-Means y DBSCAN es casi siempre necesario, porque los dos miden distancias y una columna con números grandes mandaría sobre las demás. Aquí todas las columnas ya iban de 0 a 1, así que el efecto es chico, pero la costumbre es hacerlo siempre.`]],
    st(){ estado("mira","La misma tabla, centrada. Azul sobre el promedio de la hora, rojo debajo."); lienzo(h("div",{class:"col"}, nota(`Las filas siguen siendo las mismas 20 centrales, solo cambió la unidad. Las solares quedan muy rojas de noche, porque a esa hora están muy por debajo del promedio, y azules al mediodía. <b>Esta tabla es lo único que ve K-Means.</b> Veinte filas de 24 números. No sabe la tecnología de nadie.`,"ambar"), tablaFilas(D.X,{std:true,sinNum:true}))); } },
]},
{ n:"Capítulo 3", t:"K-Means, repartir en mesas", pasos:[
  { tx:`<p>Para verlo, dibujamos las 20 centrales como <b>puntos</b>. Dos centrales con un día parecido quedan cerca, dos distintas quedan lejos.</p><p>Es un dibujo de 24 números en un plano, cómo se hace lo cuenta el Estudio 1 del cuaderno. Las de una misma tecnología caen casi en el mismo punto, así que aquí van un poco separadas para que se vean. Pasa el mouse por un punto para ver su nombre.</p>`,
    mas:[["¿Cómo se dibujan 24 números en 2?",`Con una técnica llamada PCA, que busca las dos direcciones en que los datos más se separan y se queda con esas. Se pierde algo, pero aquí muy poco, porque las centrales se diferencian sobre todo en dos cosas, si trabajan de día o parejo, y cuánto. Es el Estudio 1 del cuaderno.`]],
    st(){ estado("mira","Veinte puntos, veinte centrales. Cerca es parecido."); lienzo(h("div",{class:"col"}, escenaKM({}), nota(`Se ven cinco montoncitos a simple vista. Pero K-Means no mira el dibujo. Mira los 24 números de cada fila y mide distancias con ellos.<br><br>Y todavía nadie le ha dicho cuántos grupos hay.`))); } },
  { tx:`<p>K-Means necesita que le digan <b>cuántas mesas</b>. Le pedimos <span class="dato">6</span>.</p><p>Pone las 6 mesas <b>al azar</b>, cada una encima de una central cualquiera. Cada mesa es un cuadrado negro con letra, y el puntito negro marca el lugar exacto donde está. Todavía no sabe nada.</p>`,
    mas:[["¿Siempre parte al azar?",`Sí, y por eso dos corridas pueden dar resultados distintos si los datos son difíciles. Por eso el cuaderno le pone random_state, para que siempre parta igual, y n_init=10, para que pruebe diez partidas y se quede con la mejor.`]],
    st(){ KM.C=D.init.map(i=>D.X[i].slice()); estado("mira","Ronda 0. Seis mesas, A a F, puestas al azar."); lienzo(h("div",{class:"col"}, escenaKM({C:KM.C,mesasEn:"init"}), nota(`Hay montoncitos con dos mesas, como D y F sobre las solares, y C y E sobre las de gas, y hay montoncitos sin ninguna, las hidro y el diésel. Es lo normal al partir al azar. <b>K-Means lo arregla solo</b>, en dos pasos que repite.`))); } },
  { tx:`<p><b>Paso uno.</b> Cada central se sienta en la mesa que tiene más cerca. La línea punteada muestra a cuál se fue, y la letra queda escrita en la central.</p><p>Fíjate que hay mesas con centrales de montoncitos distintos. Es porque las mesas estaban en cualquier parte.</p>`,
    mas:[["¿Más cerca cómo se mide?",`Con la distancia entre los 24 números de la central y los 24 de la mesa. Es la misma distancia del Lab 04, la de Pitágoras, solo que con 24 lados en vez de 2. El dibujo la muestra aproximada, el algoritmo la calcula exacta.`]],
    st(){ KM.C=D.init.map(i=>D.X[i].slice()); KM.lab=asignar(D.X,KM.C); estado("mira","Ronda 1, paso uno. Cada central se va a la mesa más cercana."); lienzo(h("div",{class:"col"}, escenaKM({C:KM.C,lab:KM.lab,mesasEn:"init",lineas:true,letras:true}), nota(`Mira la mesa <b>F</b>. Le tocaron tres solares y además el diésel, que está lejos de todo y esa era su mesa menos lejana. Y la mesa <b>B</b>, que estaba sobre una carboeléctrica, se llevó también a las cinco hidro, porque no tenían mesa cerca.<br><br>Las letras A a F son las mesas. Cada central tiene la letra de la suya.`))); } },
  { tx:`<p><b>Paso dos.</b> Cada mesa se mueve al <b>centro de las centrales que se sentaron en ella</b>. Mira cómo se mueven los cuadrados.</p><p>Y se vuelve al paso uno. Con las mesas en su lugar nuevo, algunas centrales quedan más cerca de otra mesa, y se cambian.</p>`,
    st(){ KM.C=D.init.map(i=>D.X[i].slice()); KM.lab=asignar(D.X,KM.C); const s=escenaKM({C:KM.C,lab:KM.lab,mesasEn:"init",lineas:true,letras:true}); estado("mira","Ronda 1, paso dos. Las mesas se mueven al centro de los suyos."); lienzo(h("div",{class:"col"}, s, nota(`Una mesa con tres centrales se va al punto medio de las tres. Si tenía una sola, se queda donde estaba.<br><br>El centro se calcula con los 24 números, no con el dibujo. La mesa queda con un día promedio de sus centrales.`))); setTimeout(()=>{ const C2=recentrar(D.X,KM.lab,6,KM.C); s.moverMesas(C2); KM.C=C2; },700); } },
  { tx:`<p>Se repite, <b>sentarse y mover</b>, hasta que ninguna central se cambia de mesa. Ahí K-Means se detiene.</p><p>Haz clic en <b>Otra ronda</b>. Las centrales que se cambian de mesa parpadean, y arriba se dice cuántas fueron. Con estas 20 centrales se queda quieto en la ronda <span class="dato">4</span>.</p>`,
    mas:[["¿Y si nunca se detiene?",`Siempre se detiene, porque en cada ronda el desorden baja o se queda igual, y no puede bajar para siempre. Con pocos datos son unas pocas rondas. Con millones de filas pueden ser cientos, por eso sklearn pone un máximo, max_iter, que por defecto es 300.`]],
    st(){ KM.C=D.init.map(i=>D.X[i].slice()); KM.lab=asignar(D.X,KM.C); KM.C=recentrar(D.X,KM.lab,6,KM.C); KM.ronda=1; KM.listo=false;
      const s=escenaKM({C:KM.C,lab:KM.lab,mesasEn:"C",lineas:true,letras:true}); const n=nota(`<div class="op">ronda</div><div class="grande" id="rn">1</div><span id="rtx">Las mesas ya se movieron una vez. Haz clic en Otra ronda.</span>`);
      const btn=h("button",{},"Otra ronda"); const bar=estado("haz","Haz clic en Otra ronda y mira quién se cambia de mesa.",btn);
      btn.onclick=()=>{ const lab=asignar(D.X,KM.C); const cambiaron=lab.map((g,i)=>g!==KM.lab[i]?i:-1).filter(i=>i>=0); KM.lab=lab; KM.ronda++; $("#rn").textContent=KM.ronda; s.letrear(lab,cambiaron); s.relinear(lab,KM.C);
        if (cambiaron.length){ $("#rtx").innerHTML=`<b>${cambiaron.length}</b> ${cambiaron.length===1?"central se cambió":"centrales se cambiaron"} de mesa, ${cambiaron.map(i=>corto(centrales[i].n)).join(", ")}. Las mesas se vuelven a mover.`; bar.querySelector("span:nth-child(2)").innerHTML=`Ronda ${KM.ronda}. ${cambiaron.length} se cambiaron de mesa. Haz clic de nuevo.`; setTimeout(()=>{ const C2=recentrar(D.X,KM.lab,6,KM.C); s.moverMesas(C2); KM.C=C2; setTimeout(()=>s.relinear(lab,KM.C),900); },400); }
        else { $("#rtx").innerHTML=`<b>Ninguna central se cambió de mesa.</b> Las mesas tampoco se mueven. K-Means se detiene aquí.`; btn.disabled=true; estado("listo",`Ronda ${KM.ronda}. Nada cambió. K-Means terminó.`); n.classList.add("verde"); }
      };
      lienzo(h("div",{class:"col"}, s, n)); } },
  { tx:`<p>Este es el resultado. Seis mesas, cada una con sus centrales. Hasta aquí K-Means solo vio números.</p><p>Ahora pintamos cada central con la <b>tecnología real</b>, que el algoritmo nunca vio.</p><p class="remate">Cada mesa tiene exactamente una tecnología. Nadie se lo dijo. Lo sacó de la forma del día.</p>`,
    st(){ let C=D.init.map(i=>D.X[i].slice()), lab; for (let it=0; it<30; it++){ lab=asignar(D.X,C); const C2=recentrar(D.X,lab,6,C); if (C2.every((c,g)=>c.every((v,j)=>Math.abs(v-C[g][j])<1e-9))) break; C=C2; } KM.lab=lab; KM.C=C; estado("mira","Las mesas donde terminó la ronda 4, y ahora el color es la tecnología real."); lienzo(h("div",{class:"col"}, h("div",{}, escenaKM({C:KM.C,lab:KM.lab,mesasEn:"C",lineas:true,letras:true,tec:true}), leyendaTec()), h("div",{}, nota(`La tabla cruza la tecnología real con la mesa que eligió K-Means. Cada fila tiene un solo número, cada tecnología quedó en una sola mesa.`), h("div",{style:"margin-top:10px"},crossCentrales(KM.lab,6))))); } },
  { tx:`<p>¿Y por qué 6 mesas? Porque lo elegimos nosotros. <b>Cuántas mesas pedir es la decisión más importante</b>, y nadie la sabe de antemano.</p><p>Mueve el control. Con <b>4</b>, carbón, gas e hidro se sientan en una sola mesa, porque las tres trabajan parejo. Con <b>6</b> cada tecnología queda sola.</p>`,
    mas:[["¿Qué pasa con 7 u 8?",`K-Means tiene que llenar todas las mesas, así que parte una tecnología en dos aunque sus centrales sean casi iguales. Pide 8 en el control y mira cómo las hidro o las solares se reparten en dos mesas sin ninguna razón real.`]],
    st(){ const sl=h("input",{type:"range",min:1,max:8,value:6}); const val=h("span",{style:"font-weight:800;font-size:18px;min-width:24px"},"6"); const ctrl=h("span",{style:"margin-left:auto;display:flex;gap:10px;align-items:center"},"mesas",sl,val); estado("haz","Mueve el control y mira la tabla.",ctrl); const w=h("div",{class:"col"}); lienzo(w);
      const pinta=()=>{ const k=+sl.value; val.textContent=k; const r=kmeansMejor(D.X,k); w.innerHTML=""; w.append(h("div",{}, escenaKM({C:r.C,lab:r.lab,mesasEn:"C",lineas:true,letras:true,tec:true}), leyendaTec()), h("div",{}, nota(k===4? "Con 4 mesas, carbón, gas e hidro comparten una. Las tres tienen la misma forma, parejo todo el día." : k===6? "Con 6 mesas cada tecnología queda sola." : k<4? "Con tan pocas mesas se juntan formas distintas. Mira qué tecnologías comparten mesa." : "Con más de 6 mesas K-Means parte una tecnología en dos, porque igual tiene que llenar todas las mesas."), h("div",{style:"margin-top:10px"},crossCentrales(r.lab,k)))); };
      sl.oninput=pinta; pinta(); } },
  { tx:`<p>Hay una forma de orientarse. Después de repartir se mide cuánto <b>desorden queda en las mesas</b>, qué tan lejos quedó cada central del centro de la suya. El cuaderno le llama <b>inercia</b>.</p><p>Siempre baja al agregar mesas. A la curva se le dice <b>el codo</b>, porque se dobla como un brazo, y el codo está donde deja de caer fuerte.</p><p>Aquí cae fuerte hasta 3 y desde 5 ya casi no queda nada. <b>El codo está entre 3 y 5.</b> Más mesas que eso aportan poco. Elegir 6 es decisión de quien conoce las centrales y quiere cada tecnología aparte. <b>El codo orienta, no decide.</b></p>`,
    mas:[["¿Cómo se calcula la inercia?",`Para cada central, la distancia a su mesa al cuadrado. Se suman las veinte. Mientras más mesas, más cerca queda cada central de la suya, y por eso siempre baja. Con 20 mesas, una por central, sería cero.`],["¿Hay otra medida?",`Sí, la silueta, que mide qué tan separadas quedaron las mesas entre sí además de qué tan apretadas por dentro. Tiene un máximo, no solo baja. Está en el Estudio 2 del cuaderno y con estos datos también apunta a 6.`]],
    st(){ estado("mira","El codo. Cuánto desorden queda según cuántas mesas se piden."); const W=760,H=380,ml=60,mb=46,mt=26; const s=sv("svg",{viewBox:`0 0 ${W} ${H}`,style:"width:100%;height:auto;display:block"}); const I=D.inercias; const X=k=>ml+(k-1)*(W-ml-30)/7, Y=v=>mt+(H-mt-mb)*(1-v/540);
      for(let v=0;v<=500;v+=100){ s.append(sv("line",{x1:ml,x2:W-30,y1:Y(v),y2:Y(v),stroke:"#e8eaed"})); s.append(txt(ml-8,Y(v)+4,v,{"text-anchor":"end","font-size":12,fill:"#5f6368"})); }
      s.append(sv("path",{d:I.map((v,i)=>(i?"L":"M")+X(i+1)+","+Y(v)).join(" "),fill:"none",stroke:"#1a73e8","stroke-width":3}));
      I.forEach((v,i)=>{ s.append(sv("circle",{cx:X(i+1),cy:Y(v),r:7,fill:"#1a73e8",stroke:"#fff","stroke-width":2})); s.append(txt(X(i+1),Y(v)-14,es(v, v>=20?0:1),{"text-anchor":"middle","font-size":13,"font-weight":700})); s.append(txt(X(i+1),H-mb+20,i+1,{"text-anchor":"middle","font-size":13,fill:"#5f6368"})); });
      s.append(sv("line",{x1:X(3),x2:X(3),y1:mt,y2:H-mb,stroke:"#d99a00","stroke-width":2,"stroke-dasharray":"5 4"})); s.append(txt(X(3)+8,mt+60,"hasta 3 cae fuerte",{"font-size":13.5,fill:"#d99a00","font-weight":700}));
      s.append(sv("line",{x1:X(5),x2:X(5),y1:mt,y2:H-mb,stroke:"#188038","stroke-width":2,"stroke-dasharray":"5 4"})); s.append(txt(X(5)+8,mt+100,"desde 5 casi no queda nada",{"font-size":13.5,fill:"#188038","font-weight":700}));
      s.append(txt((ml+W)/2,H-6,"cuántas mesas le pedimos",{"text-anchor":"middle","font-size":12.5,fill:"#5f6368"})); s.append(txt(ml,mt-10,"desorden que queda, la inercia",{"font-size":12.5,fill:"#5f6368"}));
      lienzo(h("div",{class:"col"}, s, nota(`<b>Cómo se lee.</b><br>Con 1 mesa todo el desorden, 480. Con 2 mesas baja a 92, se separaron las solares. Con 3, a 37, se separó el diésel. Con 4 ya casi nada, 12,5.<br><br>De ahí en adelante agregar mesas ayuda poco. Por eso el codo está entre 3 y 5.`))); } },
]},
{ n:"Capítulo 4", t:"DBSCAN, barrios y lo que queda afuera", pasos:[
  { tx:`<p>Ahora miramos más de cerca. Ya no una fila por central con su día promedio, sino <b>una fila por cada día de cada central</b>, con sus 24 horas, divididas por la potencia como en el Capítulo 2.</p><p>Partamos con 10 días de una solar, <b>Altiplano</b>, y 10 días de una eólica, <b>Cerro Negro</b>.</p>`,
    mas:[["¿Por qué cambiar de tabla?",`Porque el día promedio esconde si una central es parecida a sí misma de un día a otro. Una solar sí, una eólica no. Para verlo hay que mirar los días uno por uno. Son 20 centrales por 366 días, 7.320 filas, en el cuaderno.`]],
    st(){ estado("mira","Diez días de cada una. Cada curva es un día, cada día son 24 números."); const sol=MINI.idx.slice(0,10).map(i=>D.dias.X[i]); const eol=MINI.idx.slice(20,30).map(i=>D.dias.X[i]);
      // dibujar en unidades factor originales no disponibles para todos; usamos sol5/eol5 reales de factor para el dibujo
      lienzo(h("div",{class:"col"}, h("div",{}, curvas([...D.eol5.map(y=>({y,color:TEC.eolica[1],alpha:.7,w:2.2})),...D.sol5.map(y=>({y,color:TEC.solar[1],alpha:.85,w:2.5}))],{ymax:.8,ylabel:"parte de su potencia que usa",fmt:v=>es(v,2),h:380}), leyendaTec(["solar","eolica"])), nota(`<b>La solar repite el mismo día</b> una y otra vez. Sus curvas van una encima de otra.<br><br><b>La eólica no tiene un día tipo.</b> Cada curva va por su lado, porque manda el viento.<br><br>Esa diferencia es la que DBSCAN va a encontrar solo.`))); } },
  { tx:`<p>DBSCAN necesita saber qué tan <b>parecidos</b> son dos días. Para eso mide la <b>distancia</b> entre sus 24 números. Dos días iguales están a distancia 0. Mientras más distintos, más grande el número.</p><p>Aquí tres pares de días con su distancia.</p>`,
    mas:[["¿Por qué la solar da 0,0?",`Porque los datos del curso son sintéticos y la solar se construyó con el mismo día repetido. En datos reales dos días solares se parecen mucho pero no son idénticos, por las nubes. La distancia sería chica, no cero.`]],
    st(){ estado("mira","Tres pares de días y la distancia entre ellos, con sus 24 números."); const pares=[[0,1,"día 1 de la solar","día 2 de la solar"],[20,21,"día 1 de la eólica","día 2 de la eólica"],[0,20,"día 1 de la solar","día 1 de la eólica"]]; const t=h("table",{class:"datos",style:"font-size:16px"}); t.append(h("tr",{},h("th",{},"un día"),h("th",{},"otro día"),h("th",{class:"hi"},"distancia")));
      for (const [a,b,na,nb] of pares){ const d=miniDist(a,b); t.append(h("tr",{},h("td",{style:`color:${TEC[MINI.tec[a]][1]};font-weight:700`},na),h("td",{style:`color:${TEC[MINI.tec[b]][1]};font-weight:700`},nb),h("td",{class:"num hi",style:"font-size:20px"},es(d,1)))); }
      lienzo(h("div",{class:"dos"}, t, nota(`Dos días de la solar están a <b>${es(miniDist(0,1),1)}</b>. En los datos del curso la solar repite el mismo día, así que son iguales.<br><br>Dos días de la misma eólica están a <b>${es(miniDist(20,21),1)}</b>. Ni siquiera entre ellos se parecen.<br><br>Un día solar y uno eólico están a <b>${es(miniDist(0,20),1)}</b>. Muy lejos.<br><br>La unidad es la de la tabla centrada del Capítulo 2.`))); } },
  { tx:`<p>Agreguemos 10 días de una hidro, <b>Vega Azul</b>, para tener tres tecnologías. Son 30 días como puntos.</p><p>Con la distancia, DBSCAN hace dos preguntas sencillas. No pide cuántos grupos.</p><p>Primera, <b>qué tan cerca es cerca</b>. Es el <b>radio</b>. Aquí <span class="dato">1,5</span>. Dos días a menos de 1,5 son vecinos.</p><p>Segunda, <b>cuántos vecinos hacen un barrio</b>. Aquí <span class="dato">5</span>, contándose a sí mismo.</p>`,
    mas:[["¿De dónde salen 1,5 y 5?",`Son los valores que usa el cuaderno. No hay regla fija. El radio se elige mirando a qué distancia suelen estar los puntos de sus vecinos más cercanos, y el mínimo de vecinos suele ser pequeño, entre 4 y 10. Al final de este capítulo se mueve el radio y se ve qué cambia.`]],
    st(){ estado("mira","Treinta días como puntos. En este dibujo las distancias sí respetan quién es vecino de quién."); const s=escenaMini({tec:true}); lienzo(h("div",{class:"col"}, h("div",{},s,leyendaTec(["solar","hidro","eolica"])), nota(`10 días de la solar, 10 días de una hidro, <b>Vega Azul</b>, y 10 de la eólica.<br><br>Los solares caen todos juntos. Los hidro, todos juntos en otra parte. Los eólicos quedan <b>desparramados</b>, lejos unos de otros.<br><br>Ahora apliquemos el radio.`))); } },
  { tx:`<p>Tomemos el día 1 de la solar y dibujemos un círculo de <b>radio 1,5</b> a su alrededor. Adentro caen los otros 9 días solares. Tiene 10 vecinos contándose, más que 5.</p><p>Es un <b>punto de barrio</b>. Y DBSCAN abre el barrio A con él.</p>`,
    st(){ const s=escenaMini({}); const n=nota(`<div class="op">día 1 de la solar</div><div class="grande" id="nv">…</div><span id="ntx">Dibujando el radio.</span>`); estado("calc","Dibujando el radio alrededor del día 1 de la solar."); lienzo(h("div",{class:"col"}, s, n));
      const tk=token; setTimeout(()=>{ if(tk!==token) return; s.circulo(0,1.5,"#d99a00"); const V=[...Array(30).keys()].filter(j=>miniDist(0,j)<=1.5); setTimeout(()=>{ if(tk!==token) return; V.forEach(j=>s.marcar(j,"#d99a00")); $("#nv").textContent=`${V.length} vecinos`; $("#ntx").innerHTML=`Contándose a sí mismo. Son más de 5, así que es un <b>punto de barrio</b> y DBSCAN arma con ellos el <b>barrio A</b>.`; V.forEach(j=>s.marcar(j,COLB[0],"A")); estado("listo","El día 1 de la solar tiene 10 vecinos. Es punto de barrio. Nace el barrio A."); },900); },300); } },
  { tx:`<p>El barrio <b>crece casa por casa</b>. DBSCAN visita a cada vecino, dibuja el radio alrededor de él, y si también es punto de barrio, suma a sus vecinos. Cuando no queda nadie nuevo, el barrio está completo.</p><p>Haz clic en <b>Siguiente vecino</b> y míralo crecer. Después pasa a los hidro, que forman el barrio B.</p>`,
    mas:[["¿Qué pasa con un punto con 3 vecinos?",`Si está dentro del radio de un punto de barrio, entra al barrio, pero no lo hace crecer, porque él solo no tiene vecinos suficientes. Es un borde. Si además no está cerca de ningún punto de barrio, queda fuera. En el cuaderno los de fuera llevan la etiqueta menos uno y se les llama ruido.`]],
    st(){ const s=escenaMini({}); const eps=1.5, V=[...Array(30).keys()].map(i=>[...Array(30).keys()].filter(j=>j!==i&&miniDist(i,j)<=eps));
      const lab=Array(30).fill(-2); let g=0; const cola=[]; let visitados=0;
      const n=nota(`<div class="op">barrio A</div><div class="grande" id="nb">1 punto</div><span id="ntx">Haz clic en Siguiente vecino.</span>`); const btn=h("button",{},"Siguiente vecino"); estado("haz","Haz clic en Siguiente vecino, una y otra vez.",btn); lienzo(h("div",{class:"col"}, s, n));
      lab[0]=0; s.marcar(0,COLB[0],"A"); cola.push(...V[0]); let circ=null;
      btn.onclick=()=>{ if (circ){ circ.remove(); circ=null; }
        while (cola.length && lab[cola[0]]!==-2) cola.shift();
        if (!cola.length){ // barrio terminado, buscar siguiente semilla
          const sem=lab.findIndex((l,i)=>l===-2 && V[i].length+1>=5);
          if (sem<0){ lab.forEach((l,i)=>{ if(l===-2){ lab[i]=-1; s.fuera(i);} }); estado("listo","No quedan puntos de barrio. Los que sobran quedan fuera, con círculo vacío."); $("#ntx").innerHTML=`<b>Listo.</b> Dos barrios, A con los 10 solares y B con los 10 hidro. Los 10 eólicos quedaron <b>fuera</b>, ninguno tiene siquiera un vecino a menos de 1,5.`; $("#nb").textContent="2 barrios, 10 fuera"; btn.disabled=true; return; }
          g++; lab[sem]=g; s.marcar(sem,COLB[g],LETRA[g]); cola.push(...V[sem]); $("#nb").textContent="1 punto"; n.querySelector(".op").textContent="barrio "+LETRA[g]; $("#ntx").innerHTML=`El barrio ${LETRA[g-1]} está completo. DBSCAN busca otro punto de barrio que no tenga letra, y abre el <b>barrio ${LETRA[g]}</b>.`; return; }
        const j=cola.shift(); lab[j]=g; s.marcar(j,COLB[g],LETRA[g]); circ=s.circulo(j,eps,COLB[g]); visitados++;
        const nuevos=V[j].filter(x=>lab[x]===-2); if (V[j].length+1>=5){ cola.push(...nuevos); $("#ntx").innerHTML=`Este vecino tiene ${V[j].length+1} vecinos contándose, también es punto de barrio. Sus vecinos entran al barrio ${LETRA[g]}.`; } else $("#ntx").innerHTML=`Este vecino tiene solo ${V[j].length+1} vecinos. Entra al barrio, pero no lo hace crecer.`;
        $("#nb").textContent=`${lab.filter(l=>l===g).length} puntos`; };
      } },
  { tx:`<p>Ahora con todos los datos. Cada punto es un día de una central, aquí uno de cada seis días, <span class="dato">1.220</span> puntos. En el cuaderno van los 366 días, 7.320 filas.</p><p>Este dibujo aplasta 24 números en 2, así que aquí las distancias <b>no</b> se ven bien. DBSCAN las mide con los 24 números. Haz clic en <b>Correr DBSCAN</b> y mira los barrios aparecer.</p>`,
    mas:[["¿Por qué uno de cada seis días?",`Para que el navegador dibuje y calcule rápido. El cuaderno usa los 366 días de cada central y encuentra lo mismo, tres barrios y 1.464 días fuera, que son las 4 eólicas por 366. Aquí son 4 por 61, que da 244.`]],
    st(){ const s=escenaDias({}); const btn=h("button",{},"Correr DBSCAN"); estado("haz","Haz clic en Correr DBSCAN. Radio 1,5, mínimo 5 vecinos.",btn); const n=nota(`<div class="op">barrios</div><div class="grande" id="nb">0</div><span id="ntx">Esperando.</span>`); const ley=h("div",{}); lienzo(h("div",{class:"col"}, h("div",{},s,ley), n));
      btn.onclick=async()=>{ btn.disabled=true; const tk=nuevoToken(); estado("calc","Calculando. Midiendo distancias entre 1.220 días con sus 24 números."); await sleep(50); const V=vecinosEps(1.5); const {lab,ev,grupos}=dbscanPasos(V,5); const parcial=Array(lab.length).fill(-2); estado("calc","Armando barrios, casa por casa."); let k=0, fuera=0;
        for (const e of ev){ parcial[e.i]=e.g; if (e.g===-1) fuera++; if(++k%12===0){ s.pintar(parcial); $("#nb").textContent=(Math.max(-1,...parcial)+1); $("#ntx").innerHTML=`${esN(k)} de ${esN(ev.length)} días visitados. <b>${esN(fuera)}</b> fuera hasta ahora.`; ley.innerHTML=""; ley.append(leyendaBarrios(Math.max(-1,...parcial)+1,fuera>0)); await sleep(16); if(tk!==token) return; } }
        s.pintar(lab); const ruido=lab.filter(g=>g===-1).length; $("#nb").textContent=grupos; $("#ntx").innerHTML=`<b>${grupos} barrios</b> y <b style="color:var(--rojo)">${esN(ruido)}</b> días fuera de todo barrio.`; ley.innerHTML=""; ley.append(leyendaBarrios(grupos,true)); estado("listo",`Listo. ${grupos} barrios y ${esN(ruido)} días fuera.`); };
      } },
  { tx:`<p>Resultado. <b>3 barrios</b>. Carbón, gas e hidro juntos en uno, porque trabajan parejo. El diésel en otro. La solar en el tercero.</p><p>Y <span class="dato">244</span> días fuera de todo barrio. Son exactamente <b>4 eólicas por 61 días</b>, todos los días eólicos de esta muestra. En el cuaderno, con los 366 días, son <span class="dato">1.464</span>.</p><p class="remate">Quedar fuera no es un error. Es la respuesta a la tercera pregunta. Las eólicas no tienen un día tipo.</p>`,
    mas:[["¿El ruido siempre es un hallazgo?",`No siempre. A veces es un dato mal anotado, y a veces es algo que no cabe en ningún grupo y hay que mirar. La regla es mirarlo antes de botarlo. Aquí el ruido son todas las eólicas y ninguna otra central, eso no es casualidad, es información.`]],
    st(){ const V=vecinosEps(1.5); const {lab,grupos}=dbscanPasos(V,5); const s=escenaDias({h:360}); s.pintar(lab); estado("mira","Tres barrios, y los días eólicos con círculo vacío."); lienzo(h("div",{class:"col"}, h("div",{},s,leyendaBarrios(grupos,true)), h("div",{}, nota(`La tabla cruza la tecnología real de cada día con el barrio que armó DBSCAN. La columna roja son los días que quedaron fuera.<br><br><b>Ojo con el dibujo.</b> Aplasta 24 números en 2. El montón de círculos vacíos del centro parece apretado, pero con las 24 horas esos días están lejos unos de otros, igual que los eólicos del ejemplo de 30 días.`), h("div",{style:"margin-top:10px"},crossDias(lab))))); } },
  { tx:`<p>El radio es la decisión de DBSCAN, como la cantidad de mesas lo era de K-Means. Muévelo. Recuerda que el dibujo aplasta 24 números en 2, los barrios se miden con las 24 horas.</p><p>Con <b>3,0</b> todavía quedan días eólicos afuera. Con <b>3,5</b> ya no queda ninguno, pero no porque las eólicas se hayan vuelto parejas. Es que el radio es tan grande que acepta a cualquiera como vecino, y <b>se pierde el hallazgo</b>.</p>`,
    st(){ const EPS=[1.5,2,3,3.5]; const sl=h("input",{type:"range",min:0,max:3,value:0}); const val=h("span",{style:"font-weight:800;font-size:18px;min-width:30px"},"1,5"); const ctrl=h("span",{style:"margin-left:auto;display:flex;gap:10px;align-items:center"},"radio",sl,val); estado("haz","Mueve el radio y mira cuántos quedan fuera.",ctrl);
      const s=escenaDias({h:360}); const n=nota(`<div class="op">radio 1,5</div><div class="grande" id="nb">…</div><span id="ntx"></span>`); const tab=h("div",{style:"margin-top:10px"}); const ley=h("div",{}); lienzo(h("div",{class:"col"}, h("div",{},s,ley), h("div",{},n,tab)));
      const barra=$("#estado").firstChild; const barraTxt=barra.querySelector("span:nth-child(2)"); barra.className="estado calc"; barraTxt.textContent="Calculando una sola vez las distancias para los cuatro radios."; sl.disabled=true;
      const RES={}, tk=nuevoToken(); setTimeout(()=>{ if (tk!==token) return; precalcular(EPS); for (const e of EPS) RES[e]=dbscanPasos(vecinosEps(e),5); barra.className="estado haz"; barraTxt.textContent="Mueve el radio y mira cuántos quedan fuera."; sl.disabled=false; pinta(); },30);
      const pinta=()=>{ const eps=EPS[+sl.value]; val.textContent=es(eps,1); const {lab,grupos}=RES[eps]; s.pintar(lab); const ruido=lab.filter(g=>g===-1).length; n.querySelector(".op").textContent="radio "+es(eps,1); $("#nb").textContent=`${grupos} barrios, ${esN(ruido)} fuera`; $("#ntx").innerHTML= eps<3? "Los días eólicos siguen afuera. Ninguno encuentra vecinos." : eps<3.5? "Con el radio más grande, parte de los eólicos ya entra al barrio de carbón, gas e hidro." : "Ya nadie queda afuera, pero el barrio de carbón, gas e hidro se tragó a las eólicas. <b>Se perdió el hallazgo.</b>"; tab.innerHTML=""; tab.append(crossDias(lab)); ley.innerHTML=""; ley.append(leyendaBarrios(grupos,ruido>0)); };
      sl.oninput=pinta; } },
]},
{ n:"Cierre", t:"Lo que se lleva operaciones", pasos:[
  { tx:`<p>Las tres preguntas, respondidas sin que nadie etiquetara nada.</p><p><b>1.</b> Comparando por la forma del día, las que se parecen son las de la <b>misma tecnología</b>. K-Means con 6 mesas las separó solo.</p><p><b>2.</b> Se juntan eligiendo cuántas mesas, y el codo orienta. Con 4, carbón, gas e hidro son <b>una sola familia</b> que trabaja parejo.</p><p><b>3.</b> Las <b>eólicas no tienen un día tipo</b>. DBSCAN dejó todos sus días fuera, y eso es un hallazgo, no un error.</p>`,
    st(){ estado("mira","Lo que importa para operaciones."); lienzo(h("div",{class:"portada"}, nota(`<b>Qué conviene hacer</b><br>Planificar carbón, gas e hidro en bloque, porque se comportan parejo. Tratar la solar con su curva de día. Y tratar las eólicas día a día, con el pronóstico de viento, porque ningún día se parece al anterior.`,"verde"), h("div",{style:"height:14px"}), nota(`<b>Las dos herramientas en una frase</b><br>K-Means, tú dices cuántas mesas y él sienta a cada uno en la más cercana, mueve las mesas, y repite hasta que nadie se cambia. DBSCAN, tú dices qué tan cerca es cerca y cuántos vecinos hacen un barrio, él arma los barrios casa por casa, y lo que no tiene vecinos queda afuera.`))); } },
  { tx:`<p>En el trabajo real no existe la columna tecnología para comprobar. Por eso importan el codo, la silueta, que es otra medida de lo mismo y se ve en el Estudio 2, y sobre todo el criterio de quien conoce las centrales.</p><p>Ahora, al Colab. El cuaderno tiene las mismas tres partes que esta página.</p>`,
    st(){ estado("mira","El cuaderno del Lab 05 guiado."); lienzo(h("div",{class:"portada"}, h("h3",{},"Lab 05 guiado"), h("p",{},"Parte 1 de 3, la forma y no el tamaño. Parte 2 de 3, K-Means y el codo. Parte 3 de 3, DBSCAN y el ruido, que es como el cuaderno llama a los días que quedan fuera. Los tres estudios de la sección Para estudiar quedan para la casa."), h("p",{}, h("a",{href:"https://colab.research.google.com/github/RodrigoMSB/curso-python-minergia/blob/main/modulos/modulo05/lab_guiado.ipynb",target:"_blank",style:"color:var(--azul);font-weight:700"},"Abrir el Lab 05 guiado en Colab")))); } },
]},
];

let cap=0, paso=0;
function render(){
  const C=CAPS[cap], P=C.pasos[paso]; nuevoToken();
  $("#capnum").textContent = C.n; $("#h2").textContent = C.t; $("#texto").innerHTML = P.tx;
  P.st();
  if (P.mas){ const caja=h("div",{class:"masbox",style:"display:none"}); const fila=h("div",{class:"mas"}); P.mas.forEach(([t,html],i)=>{ const b=h("button",{},t); b.onclick=()=>{ const on=b.classList.contains("on"); fila.querySelectorAll("button").forEach(x=>x.classList.remove("on")); if(on){ caja.style.display="none"; } else { b.classList.add("on"); caja.innerHTML=html; caja.style.display="block"; } }; fila.append(b); }); $("#lienzo").append(h("div",{style:"font-size:13px;color:var(--muted);margin-top:6px"},"Para saber más, toca un botón."), fila, caja); }
  $("#prev").disabled = cap===0 && paso===0; $("#next").disabled = cap===CAPS.length-1 && paso===C.pasos.length-1;
  $("#next").textContent = paso===C.pasos.length-1 && cap<CAPS.length-1 ? "Siguiente capítulo" : "Siguiente";
  const d=$("#dots"); d.innerHTML=""; C.pasos.forEach((_,i)=>d.append(h("i",{class:i===paso?"on":""})));
  document.querySelectorAll("#caps button").forEach((b,i)=>b.classList.toggle("on",i===cap));
  window.scrollTo({top:0,behavior:"smooth"});
}
function ir(d){ if(d>0){ if(paso<CAPS[cap].pasos.length-1) paso++; else if(cap<CAPS.length-1){cap++;paso=0;} } else { if(paso>0) paso--; else if(cap>0){cap--;paso=CAPS[cap].pasos.length-1;} } render(); }
$("#prev").onclick=()=>ir(-1); $("#next").onclick=()=>ir(1);
document.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return; if(e.key==="ArrowRight") ir(1); if(e.key==="ArrowLeft") ir(-1); });
CAPS.forEach((c,i)=>$("#caps").append(h("button",{onclick:()=>{cap=i;paso=0;render();}}, i===0?"Inicio": i===CAPS.length-1?"Cierre":"Cap. "+i)));
render();
</script>
