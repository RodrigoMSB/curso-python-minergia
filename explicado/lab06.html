<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 06 · Un gráfico que se entiende solo</title>
<style>
:root{--ink:#202124;--muted:#5f6368;--grid:#dadce0;--surf:#fff;--head:#f1f3f4;--celda:#f8f9fa;--navy:#0b3d62;
--azul:#1a73e8;--azul2:#e8f0fe;--ambar:#d99a00;--ambar2:#fef3d6;--verde:#188038;--verde2:#e6f4ea;--rojo:#c5221f;--rojo2:#fce8e6;--morado:#7b4fc9;--gris:#80868b;}
*{box-sizing:border-box}
html,body{margin:0;background:#f4f5f7;color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:700}
header .sub{font-size:13px;opacity:.8}
nav.caps{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav.caps button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
nav.caps button.on{background:#fff;color:var(--navy);font-weight:700}
main{display:grid;grid-template-columns:390px 1fr;gap:18px;padding:18px 24px;max-width:1540px;margin:0 auto;align-items:start}
@media (max-width:980px){main{grid-template-columns:1fr;padding:12px 16px}}
.panel{background:var(--surf);border:1px solid var(--grid);border-radius:14px;padding:20px 22px}
.story{display:flex;flex-direction:column;position:sticky;top:12px}
.capnum{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.story h2{font-size:23px;margin:4px 0 14px;line-height:1.2}
.story .texto{font-size:17.5px}
.story .texto p{margin:0 0 12px}
.story .texto b{color:var(--navy)}
.dato{display:inline;background:var(--ambar2);color:#5c4700;border-radius:6px;padding:0 6px;font-weight:700}
.remate{background:var(--ambar2);border-left:6px solid var(--ambar);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0 0;color:#5c4700;font-weight:600}
.navsteps{display:flex;align-items:center;gap:10px;margin-top:14px;border-top:1px solid var(--grid);padding-top:14px}
.navsteps button{border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;background:var(--head);color:var(--ink);font-weight:600}
.navsteps button.pri{background:var(--azul);color:#fff}
.navsteps button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--grid);display:block}
.dots i.on{background:var(--azul)}
/* escenario */
.stage{display:flex;flex-direction:column;gap:12px}
.estado{display:flex;align-items:center;gap:12px;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:600}
.estado.mira{background:var(--azul2);color:var(--navy)}
.estado.haz{background:var(--ambar2);color:#5c4700}
.estado.calc{background:#fff4e5;color:#8a4b00}
.estado.listo{background:var(--verde2);color:#14532d}
.estado .ic{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:none;background:#fff}
.estado.calc .ic{border:3px solid #f0b060;border-top-color:transparent;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.estado button{margin-left:auto;border:0;border-radius:8px;padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.estado button:disabled{opacity:.4;cursor:default}
.estado input[type=range]{width:200px}
.lienzo{flex:1;display:flex;flex-direction:column;gap:12px}
.dos{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px}
@media (max-width:1200px){.dos{grid-template-columns:1fr}}
.nota{background:var(--celda);border:1px solid var(--grid);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.5}
.nota b{color:var(--navy)}
.nota .grande{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1;margin:4px 0}
.nota .op{font-size:14px;color:var(--muted)}
.nota.ambar{background:var(--ambar2);border-color:#f0d58a;color:#5c4700}
.nota.verde{background:var(--verde2);border-color:#b7dcc1;color:#14532d}
.nota.ambar b,.nota.verde b{color:inherit}
/* tablas */
table.datos{border-collapse:separate;border-spacing:3px;font-size:15px;font-variant-numeric:tabular-nums}
table.datos th{background:var(--head);color:var(--muted);font-weight:700;padding:8px 12px;text-align:left;border-radius:5px}
table.datos td{background:var(--celda);padding:8px 12px;border-radius:5px}
table.datos td.num{text-align:right}
table.datos .hi{background:var(--azul2)!important;color:var(--azul);font-weight:700}
table.datos .hi2{background:var(--ambar2)!important;color:#5c4700;font-weight:700}
table.datos tr.dim td{opacity:.35}
/* filas de celdas grandes */
.fila{display:grid;grid-template-columns:150px 64px repeat(24,1fr);gap:3px;align-items:center;font-variant-numeric:tabular-nums}
.fila .tec{font-size:12px;font-weight:700;padding:3px 6px;border-radius:4px;text-align:center}
.fila.sinnum .cel, .fila.chica.sinnum .cel{height:22px;padding:0;font-size:0;line-height:22px}
.fila.sinnum .cel:hover{outline:2px solid var(--ink)}
.fila .rot{font-size:14px;font-weight:700;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .hh{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.fila .cel{text-align:center;border-radius:5px;padding:9px 0;font-size:12.5px;color:#fff;font-weight:600;transition:all .4s}
.fila .cel.dark{color:var(--ink)}
.fila.chica .cel{padding:4px 0;font-size:11px}
.fila.chica .rot{font-size:12.5px;font-weight:600}
.fila .cel.off{opacity:.15}
.fila .hh.on{background:var(--ambar2);color:#5c4700;border-radius:4px}
.fila .rot.on{color:var(--azul)}
.tira{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;height:90px}
.tira i{display:block;width:5px;background:var(--azul);opacity:.7;border-radius:1px 1px 0 0}
svg text{font-family:inherit}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:13px;height:13px;border-radius:50%;display:inline-block}
.cross{border-collapse:separate;border-spacing:2px;font-size:14px;font-variant-numeric:tabular-nums}
.cross th{background:var(--head);color:var(--muted);padding:4px 10px;border-radius:4px;font-weight:700}
.cross td{background:var(--celda);padding:4px 10px;text-align:center;border-radius:4px;min-width:46px}
.cross td.z{color:#c0c4c8}
.cross td.v{background:var(--azul2);color:var(--azul);font-weight:700}
.cross td.r{background:var(--rojo2);color:var(--rojo);font-weight:700}
.cross td.t{text-align:left;font-weight:700}
.portada{display:flex;flex-direction:column;justify-content:center;padding:10px 6px}
.portada h3{font-size:30px;margin:0 0 10px;color:var(--navy);line-height:1.15}
.portada p{font-size:18px;max-width:680px}
.preg{display:grid;gap:10px;margin-top:14px;max-width:680px}
.preg div{background:var(--azul2);border-radius:10px;padding:10px 14px;font-size:16px;color:var(--navy);display:flex;gap:10px}
.preg b{background:var(--azul);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.mas{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.mas button{border:1px solid var(--grid);background:#fff;border-radius:999px;padding:8px 14px;font-size:14.5px;cursor:pointer;color:var(--navy);font-weight:600}
.mas button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.masbox{background:#fff;border:1px solid var(--navy);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.5}
.masbox b{color:var(--navy)}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:10px 0 24px}
kbd{border:1px solid var(--grid);border-radius:4px;padding:0 5px;background:#fff;font-size:12px}
.parpadea{animation:pp .5s 3}
@keyframes pp{50%{opacity:.15}}
</style>
</head>
<body>
<header>
  <div><h1>Lab 06 · Un gráfico que se entiende solo</h1><div class="sub">Análisis Avanzado de Datos con Python · Subsecretaría de Energía · con los datos del curso</div></div>
  <nav class="caps" id="caps"></nav>
</header>
<main>
  <section class="panel story">
    <div class="capnum" id="capnum"></div>
    <h2 id="h2"></h2>
    <div class="texto" id="texto"></div>
    <div class="navsteps">
      <button id="prev">Anterior</button>
      <button id="next" class="pri">Siguiente</button>
      <div class="dots" id="dots"></div>
    </div>
  </section>
  <section class="panel stage">
    <div id="estado"></div>
    <div class="lienzo" id="lienzo"></div>
  </section>
</main>
<footer>Se avanza con los botones o con las flechas del teclado <kbd>→</kbd> <kbd>←</kbd>. Las cifras de las centrales salen de los archivos de datos del curso, que son inventados para el curso.</footer>

<script>

const h = (tag, attrs={}, ...kids) => { const e = document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (k==="class") e.className=v; else if (k==="style") e.style.cssText=v; else if (k==="html") e.innerHTML=v; else if (k.startsWith("on")) e[k]=v; else e.setAttribute(k,v);} for (const k of kids) e.append(k); return e; };

const dist2 = (a,b) => { let s=0; for (let i=0;i<a.length;i++){const d=a[i]-b[i]; s+=d*d;} return s; };

const sleep = ms => new Promise(r => setTimeout(r, ms));

  if (extra) b.append(extra); e.append(b); return b;
}
function lienzo(...nodos){ const L=$("#lienzo"); L.innerHTML=""; for (const n of nodos) if (n) L.append(n); }

/* ---------- componentes ---------- */
function filaCeldas(valores, opts={}) {
  // valores: 24 números. opts: {rot, max, dec, chica, colsOn, rotOn, fmt, std}
  const f = h("div",{class:"fila"+(opts.chica?" chica":"")+(opts.sinNum?" sinnum":"")});
  f.append(h("div",{class:"rot"+(opts.rotOn?" on":""), title:opts.rot||""}, opts.rot||""));
  const tk = opts.tec ? TEC[opts.tec] : null;
  f.append(h("div",{class:"tec", style: tk? `background:${tk[1]}22;color:${tk[1]}` : ""}, tk? tk[0] : ""));
  valores.forEach((v,k)=>{
    let bg, dark, t;
    if (opts.std){ const a=0.12+0.88*Math.min(1,Math.abs(v)/2.3); bg = v>=0? `rgba(26,115,232,${a.toFixed(2)})` : `rgba(197,34,31,${a.toFixed(2)})`; dark = Math.abs(v)<1; t=(v>=0?"+":"")+v.toFixed(1); }
    else { const fr=Math.min(1, v/opts.max); const a=0.1+0.9*fr; bg=`rgba(26,115,232,${a.toFixed(2)})`; dark = fr<0.45; t = opts.fmt? opts.fmt(v) : (opts.dec===0? Math.round(v) : v.toFixed(opts.dec??2)); }

    f.append(h("div",{class:"cel"+(dark?" dark":"")+(off?" off":""), style:`background:${bg}`, title:`${opts.rot||""}, ${k} h, ${t}`}, String(t)));

      estado("haz","Marca las casillas y mira cómo cambia el gráfico.",casillas); lienzo(w, nota(`Fíjate que los datos <b>no cambian</b>. Cambia solo lo que está escrito alrededor. Y eso es lo que hace que otra persona pueda leerlo.`)); pinta(); } },
  { tx:`<p>Hay <b>cuatro gráficos básicos</b> y cada uno responde una pregunta distinta. Elige uno arriba y mira la pregunta que responde.</p><p>Línea para cómo cambia algo en el tiempo. Barras para comparar categorías. Dispersión para ver si dos números van juntos. Histograma para ver cómo se reparte un solo número.</p>`,
    mas:[["¿Y el gráfico de torta?","Existe y se usa mucho, pero se lee mal. Comparar porciones de una torta a ojo es difícil, sobre todo cuando son parecidas. Unas barras ordenadas muestran lo mismo y se comparan mejor. En el curso no se usa."],["¿Por qué las barras van ordenadas?","Porque las tecnologías no tienen un orden natural, como sí lo tiene el tiempo. Entonces el orden lo pone uno, y el que más sirve es de mayor a menor, para que el ojo compare sin saltar."]],
    st(){ const tipos=[["linea","Línea",graficoLinea,"¿Cómo cambió la generación durante el año?","El tiempo tiene orden y va de izquierda a derecha. Cada día es un punto y se unen con una línea. Se ve cómo sube hacia el invierno, con el máximo en julio, y baja hacia el verano."],["barras","Barras",graficoBarras,"¿Qué tecnología generó más en el año?","Las tecnologías son categorías, no tienen orden. Una barra por cada una, ordenadas de mayor a menor. Hidro primero, diésel último."],["disp","Dispersión",graficoDispersion,"¿Una central más grande genera más?","Un punto por central, potencia contra generación. Si los puntos forman una diagonal, van juntos. Las solares quedan abajo, mucha potencia y poca generación, porque solo trabajan de día."],["hist","Histograma",graficoHistograma,"¿Cómo se reparten las horas de la Metropolitana?","Un solo número, la demanda por hora, repartido en cajones. Cuenta cuántas horas del año cayeron en cada cajón. La mayoría entre 700 y 1.100 MWh."]];
      const botones=h("span",{style:"margin-left:auto;display:flex;gap:8px"}); const w=h("div",{}); const n=nota("");
      const pinta=(k)=>{ const t=tipos.find(x=>x[0]===k); w.innerHTML=""; w.append(t[2]()); n.innerHTML=`<div class="op">la pregunta</div><div class="grande" style="font-size:22px">${t[3]}</div>${t[4]}`; botones.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===k)); };
      tipos.forEach(t=>{ const b=h("button",{"data-k":t[0]},t[1]); b.style.cssText="margin:0;background:#fff;color:var(--navy);border:1px solid var(--grid)"; b.onclick=()=>{ pinta(t[0]); botones.querySelectorAll("button").forEach(x=>x.style.background=x.dataset.k===t[0]?"var(--navy)":"#fff"); botones.querySelectorAll("button").forEach(x=>x.style.color=x.dataset.k===t[0]?"#fff":"var(--navy)"); }; botones.append(b); });
      estado("haz","Elige un gráfico y mira la pregunta que responde.",botones); lienzo(w,n); botones.querySelector("button").click(); } },
  { tx:`<p>En matplotlib, los cuatro se escriben casi igual. Son <b>seis líneas</b> y siempre las mismas.</p><p>Pasa el mouse por cada línea de código y mira qué parte del gráfico dibuja.</p>`,
    mas:[["¿Por qué fig y ax?","fig es la hoja completa y ax es el gráfico dibujado en ella. Una hoja puede tener varios gráficos, varios ax. Casi todo lo que se ajusta, título, ejes, línea, se le pide al ax."],["¿Y para barras?","Se cambia ax.plot por ax.barh, y para dispersión ax.scatter, y para histograma ax.hist. El resto de las líneas no cambia. Por eso aprender una vez sirve para los cuatro."]],
    st(){ estado("mira","Seis líneas de código. Cada una dibuja una parte del gráfico."); const w=h("div",{class:"dos"}); const g=h("div",{}); const c=h("div",{}); w.append(g,c); const partes=[null,"linea","titulo","unidad",null];
      const pinta=(i)=>{ g.innerHTML=""; g.append(graficoSemana({titulo:true,unidad:true,fuente:false})); c.innerHTML=""; c.append(bloqueCodigo(i, pinta), h("div",{class:"nota",style:"margin-top:10px"}, i==null? "Pasa el mouse por una línea." : CODIGO[i][1])); };
      pinta(null); lienzo(w); } },
]},
{ n:"Capítulo 2", t:"Un año entero sin que sea un borrón", pasos:[
  { tx:`<p>Ahora la jefatura quiere ver <b>todo 2024</b>. Son 8.784 horas. Haz clic en <b>Dibujar</b> y mira lo que pasa si se dibujan todas.</p>`,
    mas:[["¿Por qué sale un borrón?","Porque en 760 píxeles de ancho caben 8.784 puntos, más de once por píxel. La línea sube y baja dentro de cada día, de 500 de madrugada a 1.300 en la tarde, y eso se repite 366 veces. El ojo solo ve el relleno."]],
    st(){ const w=h("div",{}); const btn=h("button",{},"Dibujar"); estado("haz","Haz clic en Dibujar para trazar las 8.784 horas.",btn); const n=nota(`<div class="op">puntos dibujados</div><div class="grande" id="np">0</div><span id="ntx">Esperando.</span>`); lienzo(w,n);
      btn.onclick=async()=>{ btn.disabled=true; const tk=token; estado("calc","Dibujando hora por hora."); $("#ntx").textContent="Dibujando, una hora tras otra."; const s=graficoAnio("horas"); const total=s.p.getTotalLength(); s.p.style.strokeDasharray=total; s.p.style.strokeDashoffset=total; w.innerHTML=""; w.append(s); const t0=performance.now(); const dur=4000;
        const paso=()=>{ if(tk!==token) return; const f=Math.min(1,(performance.now()-t0)/dur); s.p.style.strokeDashoffset=total*(1-f); $("#np").textContent=esN(Math.round(8784*f)); if(f<1) requestAnimationFrame(paso); else { estado("listo","Las 8.784 horas dibujadas. Un borrón."); $("#ntx").innerHTML="Sube y baja cada día, de la madrugada a la tarde, 366 veces. <b>Dibujar todo no es mostrar más, es mostrar menos.</b>"; } }; requestAnimationFrame(paso); }; } },
  { tx:`<p>La solución no es dibujar más pequeño. Es <b>juntar</b>. En vez de 24 puntos por día, un solo punto, el promedio de ese día. Quedan 366.</p><p>Haz clic en <b>Promediar por día</b>.</p>`,
    mas:[["¿Y esto en el cuaderno?","Es resample. Con la fecha como índice, demanda.resample(\"D\").mean() promedia por día. Con \"W\" promedia por semana y con \"M\" por mes. Una letra cambia la escala."],["¿Se pierde información?","Sí, a propósito. Se pierde el sube y baja dentro de cada día, que para la pregunta del año no importa. Si la pregunta fuera sobre las horas del día, se mira de otra forma, que viene dos pasos más adelante."]],
    st(){ const w=h("div",{},graficoAnio("horas")); const btn=h("button",{},"Promediar por día"); estado("haz","Haz clic en Promediar por día.",btn); const n=nota(`<div class="op">puntos</div><div class="grande" id="np">8.784</div><span id="ntx">Una hora, un punto.</span>`); lienzo(w,n);
      btn.onclick=()=>{ btn.disabled=true; w.innerHTML=""; w.append(graficoAnio("dias")); $("#np").textContent="366"; $("#ntx").innerHTML="Un día, un punto, el promedio de sus 24 horas. <b>Ya se lee.</b> Baja en verano, sube en invierno, con un pico en julio."; estado("listo","366 puntos. Ahora se ve el año."); }; } },
  { tx:`<p>Todavía salta de un día a otro. Para ver la <b>tendencia</b> se dibuja encima una línea suave, el promedio de varios días seguidos. Se llama <b>media móvil</b>.</p><p>Mueve la ventana. Con 1 día es la misma línea. Con 14 se ve la tendencia. Con 60 se pierde el detalle.</p>`,
    mas:[["¿Cómo se calcula?","Para cada día se promedian los 14 días de alrededor, la mitad antes y la mitad después. La ventana se corre un día y se vuelve a promediar. Por eso se llama móvil. En pandas es rolling(14, center=True).mean(), como en el cuaderno."],["¿Por qué dibujar las dos?","Porque el detalle dice qué pasó cada día y la tendencia dice hacia dónde va. Si solo se muestra la suave, se esconden los días raros. Si solo se muestra el detalle, no se ve el rumbo. Juntas, cada una ayuda a leer la otra."]],
    st(){ const sl=h("input",{type:"range",min:1,max:60,value:14}); const val=h("span",{style:"font-weight:800;font-size:18px;min-width:40px"},"14 días"); const ctrl=h("span",{style:"margin-left:auto;display:flex;gap:10px;align-items:center"},"ventana",sl,val); estado("haz","Mueve la ventana de la media móvil.",ctrl); const w=h("div",{}); const n=nota(""); lienzo(w,n);
      const pinta=()=>{ const v=+sl.value; val.textContent=v+(v===1?" día":" días"); w.innerHTML=""; w.append(graficoAnio("movil",v)); n.innerHTML = v<5? "Con una ventana tan corta la línea roja sigue casi todos los saltos. Todavía no es una tendencia." : v<=30? "La línea roja muestra el rumbo del año. La azul, el día a día. <b>Se leen juntas.</b>" : "Con una ventana tan larga la línea roja ya no ve el pico de julio. Suavizar de más también esconde."; };
      sl.oninput=pinta; pinta(); } },
  { tx:`<p>El mismo dato se puede mirar de otra forma. En vez de por fecha, <b>por hora del día</b>. Se promedian todos los días de invierno hora por hora, y lo mismo para el verano.</p><p>Responde otra pregunta. No cómo fue el año, sino <b>cómo es un día típico</b>. Haz clic en <b>Agregar el verano</b>.</p>`,
    mas:[["¿Y esto en el cuaderno?","Es un groupby por hora, igual que en el Lab 02, filtrando antes los meses de cada estación. Se dibujan las dos curvas en el mismo ax con dos ax.plot."],["¿Por qué invierno arriba a toda hora?","Porque en invierno se usa calefacción y hay menos luz natural, así que la demanda es mayor incluso de madrugada. El pico de las 19 a las 21 es cuando todos llegan a la casa."]],
    st(){ const w=h("div",{},graficoEstacion(["inv"])); const btn=h("button",{},"Agregar el verano"); estado("haz","El invierno ya está. Haz clic para agregar el verano.",btn); const n=nota(`El invierno, de junio a agosto. La demanda sube durante la mañana y tiene su pico a las <b>${D.invierno.indexOf(Math.max(...D.invierno))} horas</b>, con ${esN(Math.round(Math.max(...D.invierno)))} MWh.`); lienzo(w,n);
      btn.onclick=()=>{ btn.disabled=true; w.innerHTML=""; w.append(graficoEstacion(["inv","ver"])); n.innerHTML=`El verano tiene la misma forma pero más abajo a toda hora. A las 20 horas, <b>${esN(Math.round(D.invierno[20]))}</b> en invierno contra <b>${esN(Math.round(D.verano[20]))}</b> en verano. <b>Un mismo dato, dos preguntas, dos gráficos.</b>`; estado("listo","Dos estaciones, mismo eje. Se comparan de un vistazo."); }; } },
]},
{ n:"Capítulo 3", t:"Antes de mandarlo", pasos:[
  { tx:`<p>Alguien manda este gráfico. Los números son correctos, la generación del año de cada central. Pero mira cómo se lee.</p><p>Nombres torcidos, barras en cualquier orden, sin título, sin unidad. Es una foto tomada de lado y borrosa.</p>`,
    mas:[["¿Por qué sale así?","Porque es lo que matplotlib hace si solo se le pide ax.bar con veinte nombres largos. Los pone en el orden de la tabla y los gira para que quepan. No es un error, es la falta de los dos minutos de arreglo."]],
    st(){ estado("mira","El gráfico tal como sale, sin ningún arreglo."); lienzo(graficoAntes(), nota(`Para saber cuál es la central que más generó hay que leer veinte nombres girados y comparar alturas a ojo. <b>Más de diez segundos.</b>`)); } },
  { tx:`<p>Los mismos números. Tres arreglos, uno por casilla.</p><p><b>Ordenar</b> de mayor a menor. <b>Barras acostadas</b> con el nombre derecho y sin la palabra Central o Parque delante. <b>El número al final</b> de cada barra, y el título con la unidad.</p><p class="remate">No cambiaste ningún número. Cambiaste cómo se presenta. Y eso toma dos minutos.</p>`,
    mas:[["¿Y esto en el cuaderno?","sort_values para ordenar, ax.barh en vez de ax.bar para acostar las barras, y ax.bar_label para poner el número al final. Son las tres líneas del Bloque 7 del cuaderno."],["¿Por qué el número al final?","Porque quien lee quiere el dato, no estimarlo. Con el número escrito ya no hace falta mirar el eje. Y el eje se puede dejar más liviano."]],
    st(){ const op={ordenar:false,numeros:false,titulo:false}; const w=h("div",{}); const casillas=h("span",{style:"margin-left:auto;display:flex;gap:16px;align-items:center;font-weight:600"});
      const pinta=()=>{ w.innerHTML=""; w.append(graficoDespues(op)); const n=Object.values(op).filter(Boolean).length; const b=$("#estado").firstChild; b.className="estado "+(n===3?"listo":"haz"); b.querySelector("span:nth-child(2)").textContent = n===3? "Listo para mandar. Se lee en diez segundos." : "Marca las casillas y mira cómo cambia."; };
      for (const [k,t] of [["ordenar","Ordenar"],["numeros","Número al final"],["titulo","Título y unidad"]]) { const c=h("input",{type:"checkbox"}); c.onchange=()=>{ op[k]=c.checked; pinta(); }; casillas.append(h("label",{style:"display:flex;gap:5px;align-items:center;cursor:pointer"},c,t)); }
      estado("haz","Marca las casillas y mira cómo cambia.",casillas); lienzo(w); pinta(); } },
  { tx:`<p>Una trampa que se hace sin querer. El eje de las barras <b>no empieza en cero</b>, y una diferencia pequeña parece enorme.</p><p>Las tres centrales que más generaron. Con el eje cortado en 2.000, Río Manso Alto casi desaparece y Costa Brava parece veinte veces más grande. Haz clic para ver el eje desde cero.</p>`,
    mas:[["¿Quién corta el eje?","A veces el programa, solo, para que las barras llenen el espacio. A veces la persona, para que una diferencia se note. En los dos casos el lector sale con una idea equivocada. Para barras, el eje parte en cero, siempre."],["¿Y en una línea?","En un gráfico de línea el eje sí puede partir donde convenga, porque lo que se lee es la forma, no la altura de la barra. Lo que importa es que se note dónde empieza. La regla dura es para barras."]],
    st(){ const w=h("div",{},graficoEje(false)); const btn=h("button",{},"Eje desde cero"); estado("haz","Mira el eje. Empieza en 2.000. Haz clic para ponerlo en cero.",btn); const n=nota(`Costa Brava <b>2.699</b>, Bahía Norte <b>2.183</b>, Río Manso Alto <b>2.030</b> GWh. En el gráfico la barra de Río Manso Alto es una raya y la de Costa Brava parece veinte veces más grande. La diferencia real es de un tercio.`); lienzo(w,n);
      btn.onclick=()=>{ btn.disabled=true; w.innerHTML=""; w.append(graficoEje(true)); n.innerHTML="Los mismos tres números. Ahora la diferencia se ve como es, Costa Brava un tercio más que Río Manso Alto. <b>El gráfico no mintió con los números, mintió con el eje.</b>"; estado("listo","Eje desde cero. La diferencia real."); }; } },
  { tx:`<p>Antes de mandar un gráfico, tres preguntas. Son las de este lab.</p><p>Marca las tres sobre el gráfico de la derecha. Es el que arreglamos recién.</p>`,
    mas:[["¿Y si no cumple alguna?","No se manda. Dos minutos más y se arregla. Un gráfico que llega mal hecho se queda mal hecho en el informe para siempre, y el que lo lee no va a preguntar, va a concluir."]],
    st(){ const items=[["¿Dice qué es, de dónde sale y en qué unidad está?","Título, ejes y unidad. Siempre."],["¿Es el gráfico correcto para la pregunta?","Línea para el tiempo, barras para comparar, dispersión para dos números, histograma para uno."],["¿Se lee en diez segundos?","Barras ordenadas, nombres derechos, el número al final. Y el eje de las barras desde cero."]];
      const lista=h("div",{style:"display:grid;gap:10px"}); let n=0;
      items.forEach(([q,r])=>{ const c=h("input",{type:"checkbox",style:"width:20px;height:20px"}); const box=h("label",{style:"display:flex;gap:12px;align-items:flex-start;background:var(--celda);border:1px solid var(--grid);border-radius:10px;padding:12px 14px;cursor:pointer"},c,h("div",{},h("div",{style:"font-weight:700;color:var(--navy)"},q),h("div",{style:"font-size:14.5px;color:var(--muted)"},r))); c.onchange=()=>{ n+=c.checked?1:-1; box.style.background=c.checked?"var(--verde2)":"var(--celda)"; if(n===3) estado("listo","Las tres. Este gráfico se puede mandar."); else estado("haz","Revisa el gráfico con las tres preguntas."); }; lista.append(box); });
      estado("haz","Revisa el gráfico con las tres preguntas."); lienzo(h("div",{class:"col"}, lista, graficoDespues({ordenar:true,numeros:true,titulo:true}))); } },
]},
{ n:"Cierre", t:"Las respuestas para la jefatura", pasos:[
  { tx:`<p>Las tres preguntas del lab.</p><p><b>1.</b> Línea para cómo cambia en el tiempo. Barras para cuál es mayor. Dispersión para si dos números van juntos. Histograma para cómo se reparte uno.</p><p><b>2.</b> Un año se muestra juntando por día y suavizando con una media móvil. El detalle y la tendencia, en el mismo gráfico.</p><p><b>3.</b> Antes de mandarlo, título, unidad y fuente. Barras ordenadas con el número al final. Y el eje de las barras desde cero.</p>`,
    st(){ estado("mira","Lo que se lleva la jefatura."); lienzo(h("div",{class:"portada"}, nota(`<b>Un gráfico es una frase.</b> Si no dice qué es, de dónde sale y en qué unidad está, no es información, es una foto de un número.`,"verde"), h("div",{style:"height:14px"}), nota(`<b>Dibujar todo no es mostrar más.</b> 8.784 puntos son un borrón. Juntar por día y suavizar es lo que deja ver el año.`), h("div",{style:"height:14px"}), nota(`<b>Dos minutos antes de mandarlo.</b> Ordenar, acostar, poner el número y el título, y revisar que el eje parta en cero. Los números no cambian, la lectura sí.`))); } },
  { tx:`<p>Ahora, al Colab. El cuaderno va numerado del bloque 1 al 7. En clase se corren la celda de inicio y los bloques 1, 2, 4 y 7, que son las tres partes de esta página. Los bloques 3, 5 y 6 quedan para la casa.</p>`,
    st(){ estado("mira","El cuaderno del Lab 06."); lienzo(h("div",{class:"portada"}, h("h3",{},"Lab 06"), h("p",{},"Bloque 1, anatomía de un gráfico. Bloque 2, los cuatro básicos. Bloque 4, series de tiempo con resample y media móvil. Bloque 7, antes y después. Para la casa, Bloque 3 Seaborn, Bloque 5 distribuciones y Bloque 6 Plotly."), h("p",{}, h("a",{href:"https://colab.research.google.com/github/RodrigoMSB/curso-python-minergia/blob/main/modulos/modulo06/lab.ipynb",target:"_blank",style:"color:var(--azul);font-weight:700"},"Abrir el Lab 06 en Colab")))); } },
]},
];


let cap=0, paso=0;
function render(){
  const C=CAPS[cap], P=C.pasos[paso]; nuevoToken();
  $("#capnum").textContent = C.n; $("#h2").textContent = C.t; $("#texto").innerHTML = P.tx;
  P.st();
  if (P.mas){ const caja=h("div",{class:"masbox",style:"display:none"}); const fila=h("div",{class:"mas"}); P.mas.forEach(([t,html],i)=>{ const b=h("button",{},t); b.onclick=()=>{ const on=b.classList.contains("on"); fila.querySelectorAll("button").forEach(x=>x.classList.remove("on")); if(on){ caja.style.display="none"; } else { b.classList.add("on"); caja.innerHTML=html; caja.style.display="block"; } }; fila.append(b); }); $("#lienzo").append(h("div",{style:"font-size:13px;color:var(--muted);margin-top:6px"},"Para saber más, toca un botón."), fila, caja); }
  $("#prev").disabled = cap===0 && paso===0; $("#next").disabled = cap===CAPS.length-1 && paso===C.pasos.length-1;
  $("#next").textContent = paso===C.pasos.length-1 && cap<CAPS.length-1 ? "Siguiente capítulo" : "Siguiente";
  const d=$("#dots"); d.innerHTML=""; C.pasos.forEach((_,i)=>d.append(h("i",{class:i===paso?"on":""})));
  document.querySelectorAll("#caps button").forEach((b,i)=>b.classList.toggle("on",i===cap));
  window.scrollTo({top:0,behavior:"smooth"});
}
function ir(d){ if(d>0){ if(paso<CAPS[cap].pasos.length-1) paso++; else if(cap<CAPS.length-1){cap++;paso=0;} } else { if(paso>0) paso--; else if(cap>0){cap--;paso=CAPS[cap].pasos.length-1;} } render(); }
$("#prev").onclick=()=>ir(-1); $("#next").onclick=()=>ir(1);
document.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return; if(e.key==="ArrowRight") ir(1); if(e.key==="ArrowLeft") ir(-1); });
CAPS.forEach((c,i)=>$("#caps").append(h("button",{onclick:()=>{cap=i;paso=0;render();}}, i===0?"Inicio": i===CAPS.length-1?"Cierre":"Cap. "+i)));
render();
</script>
